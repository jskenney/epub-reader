# The tests that need the real voice models (REVIEW.md T-4) and internet access (T-5), which the usual run
# skips: weekly, so upstream changes (a CDN, Hugging Face's download hosts, a model file) show up, and on demand.
name: Slow tests
on:
  schedule:
    - cron: '17 4 * * 1'   # Mondays, 04:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Playwright
        run: cd tests && npm ci && npx playwright install --with-deps chromium
      # The models (about 900 MB) kept between runs, keyed on their pinned checksums: a new pin downloads afresh.
      - uses: actions/cache@v4
        with:
          path: |
            kokoro
            pocket
          key: voice-models-${{ hashFiles('checksums/kokoro.sha256', 'checksums/pocket.sha256') }}
      - name: Self-hosted files (checked against checksums/)
        run: ./fetch-libs.sh && ./fetch-fonts.sh && ./fetch-kokoro.sh && ./fetch-pocket.sh en
      - name: Tests, with the real models and the CDN policy
        run: SLOW=1 NETWORK=1 tests/run.sh
