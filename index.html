<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spine Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: one-screen reading app. Top bar, contents rail on the left, the page as the one framed object, a segmented spine ribbon along the bottom. */
:root{
  --paper:#EEF0EC; --surface:#F7F8F5; --ink:#1C2120; --muted:#5C6661; --rule:#D3D8D2;
  --ribbon:#8B2A3B; --on-ribbon:#FFFFFF; --ribbon-soft:#F0DCDF; --warn-soft:#F7E6CF;
  --page-bg:#FDFDFB; --page-ink:#1C2120;
  --shadow:0 1px 2px rgb(20 30 25 / .05), 0 10px 30px -14px rgb(20 30 25 / .22);
  --font-read:"Literata", Georgia, "Times New Roman", serif;
  --font-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121514; --surface:#1A1E1C; --ink:#DCE2DE; --muted:#939D97; --rule:#2C3330;
    --ribbon:#E27D8E; --on-ribbon:#1E0E12; --ribbon-soft:#3A2228; --warn-soft:#3B2C17;
    --page-bg:#171A19; --page-ink:#D6DCD8;
    --shadow:0 1px 2px rgb(0 0 0 / .4), 0 12px 30px -14px rgb(0 0 0 / .7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121514; --surface:#1A1E1C; --ink:#DCE2DE; --muted:#939D97; --rule:#2C3330;
  --ribbon:#E27D8E; --on-ribbon:#1E0E12; --ribbon-soft:#3A2228; --warn-soft:#3B2C17;
  --page-bg:#171A19; --page-ink:#D6DCD8;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 12px 30px -14px rgb(0 0 0 / .7);
  color-scheme:dark;
}

[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.45 var(--font-ui);overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--rule)}
.book-id{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
#bookTitle{font:italic 400 1.2rem/1.2 var(--font-read);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bookAuthor{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:8px}
.size{display:flex;align-items:center;gap:2px}
#fontPct,.readout{font:500 12px/1 var(--font-mono);color:var(--muted);min-width:4ch;text-align:center;font-variant-numeric:tabular-nums}
.btn{font:500 13px/1 var(--font-ui);color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:6px;
  height:34px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.ribbon:focus-visible,#tocList a:focus-visible{outline:2px solid var(--ribbon);outline-offset:2px}
.btn.ghost{border-color:transparent;padding:0 9px}
.btn.ghost:hover:not(:disabled){border-color:var(--rule)}
.btn.primary{background:var(--ribbon);border-color:var(--ribbon);color:var(--on-ribbon)}
.btn.primary:hover{filter:brightness(1.08)}
.btn svg{width:16px;height:16px;flex:none}
#fileInput{display:none}

/* body */
.main{flex:1;min-height:0;display:flex;gap:20px;position:relative;padding-block:16px}
.toc{width:280px;flex:none;overflow:auto;display:flex;flex-direction:column;gap:24px;padding-right:4px}
.toc.collapsed{display:none}
.meta-title{font:600 1.3rem/1.25 var(--font-read);margin:0;text-wrap:balance}
.meta-authors{color:var(--muted);margin:4px 0 0}
.label{font:500 11px/1 var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
#tocList ol{list-style:none;margin:0;padding:0}
#tocList ol ol{padding-left:10px;margin-left:9px;border-left:1px solid var(--rule)}
#tocList a,#tocList span{display:block;padding:6px 9px;border-radius:5px;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35}
#tocList a:hover{background:var(--surface)}
#tocList a[aria-current]{background:var(--ribbon-soft);color:var(--ribbon);font-weight:500}
#tocList span{color:var(--muted)}
.desc{margin-top:12px;font-size:13px}
.desc summary{cursor:pointer;color:var(--muted);font:500 11px/1 var(--font-mono);letter-spacing:.09em;text-transform:uppercase;padding:4px 0;width:max-content}
.desc summary:hover{color:var(--ink)}
.desc summary:focus-visible{outline:2px solid var(--ribbon);outline-offset:2px}
#metaDescBody{display:flex;flex-direction:column;gap:8px;margin-top:8px;font-family:var(--font-read);font-size:13.5px;line-height:1.55;max-height:40vh;overflow:auto}
#metaDescBody p{margin:0}
.pkg{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font:12px/1.4 var(--font-mono);margin:0}
.pkg dt{color:var(--muted)}
.pkg dd{margin:0;overflow-wrap:anywhere;min-width:0}

.reader{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;position:relative}
#page{flex:1;min-height:0;width:100%;border:1px solid var(--rule);border-radius:4px;background:var(--page-bg);box-shadow:var(--shadow);display:block}
.notice{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:9px 10px 9px 14px;border-radius:6px;background:var(--ribbon-soft);font-size:13px}
.notice.error{background:var(--warn-soft)}
.notice p{margin:0;flex:1;min-width:14em}
.notice .btn{height:30px}
.status{position:absolute;inset:0;display:grid;place-items:center;font:500 13px/1.4 var(--font-mono);color:var(--muted);
  background:color-mix(in srgb,var(--paper) 75%,transparent);border-radius:4px;text-align:center;padding:16px}

/* footer */
.foot{display:flex;align-items:center;gap:14px;padding-block:10px 12px;border-top:1px solid var(--rule)}
.where{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.loc{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
#chapLabel{font-family:var(--font-read);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mono{font:12px/1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.ribbon{--n:1;position:relative;height:7px;border-radius:2px;background:var(--rule);overflow:hidden;cursor:pointer}
.ribbon::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100% / var(--n) - 2px),var(--paper) calc(100% / var(--n) - 2px),var(--paper) calc(100% / var(--n)))}
.ribbon.dense::after{display:none}
#ribbonFill{height:100%;width:0;background:var(--ribbon);transition:width .2s ease-out}

.drop{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:color-mix(in srgb,var(--paper) 88%,transparent)}
.drop div{pointer-events:none;border:2px dashed var(--ribbon);border-radius:10px;padding:40px 48px;font:italic 1.4rem var(--font-read);color:var(--ribbon);text-align:center}

/* full-screen reading: only the page remains */
.app.fs{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.app.fs .bar,.app.fs .foot,.app.fs .toc,.app.fs .notice{display:none !important}
.app.fs .main{padding-block:0;gap:0}
.app.fs #page{border:0;border-radius:0;box-shadow:none}
.fs-pill{position:fixed;z-index:15;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px;padding:5px 5px 5px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--rule);
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s}
.app:not(.fs) .fs-pill{display:none}
.app.fs.awake .fs-pill,.fs-pill:focus-within{opacity:1;pointer-events:auto}
.fs-pill .btn{height:30px}
kbd{font:500 11px/1 var(--font-mono);border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:2px 5px;color:var(--muted)}

/* theme toggle shows the icon of the mode it switches to */
#themeBtn .i-sun{display:none}
#themeBtn.dark .i-sun{display:block}
#themeBtn.dark .i-moon{display:none}

/* read-aloud bar, floating over the bottom margin of the page */
.tts{position:absolute;z-index:6;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;
  width:max-content;max-width:calc(100% - 24px);box-sizing:border-box;padding:6px 8px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow)}
.tts .btn{height:32px}
.tts .btn.primary{width:40px;justify-content:center;padding:0}
.tts-speed{display:flex;align-items:center;gap:6px;padding:0 4px}
.tts-speed input{width:96px;accent-color:var(--ribbon)}
#ttsRateVal{min-width:3.5ch}
#ttsVoice,#ttsEngine{height:32px;max-width:190px;font:400 13px var(--font-ui);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:0 6px}
#ttsVoice:focus-visible,#ttsEngine:focus-visible,.tts-speed input:focus-visible{outline:2px solid var(--ribbon);outline-offset:2px}
#ttsStatus{font:12px/1.3 var(--font-mono);color:var(--muted);padding:0 4px}
#ttsPlay .i-pause,#ttsPlay.playing .i-play{display:none}
#ttsPlay.playing .i-pause{display:block}
#ttsBtn[aria-pressed="true"]{border-color:var(--ribbon);color:var(--ribbon)}

/* font picker */
.font-pick{position:relative}
#fontBtn .aa{font-size:16px;line-height:1;font-weight:500}
#fontBtn svg{width:10px;height:10px}
.menu{position:absolute;z-index:30;right:0;top:calc(100% + 6px);width:270px;max-width:calc(100vw - 32px);box-sizing:border-box;
  display:flex;flex-direction:column;gap:2px;padding:8px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadow)}
.menu .label{margin:4px 8px 8px}
.opt{display:flex;align-items:baseline;justify-content:space-between;gap:12px;width:100%;padding:8px 10px;border:0;border-radius:5px;
  background:transparent;color:var(--ink);cursor:pointer;text-align:left;font-size:17px;line-height:1.25}
.opt:hover,.opt:focus-visible{background:var(--paper);outline:none}
.opt small{font:400 11px/1.2 var(--font-mono);color:var(--muted);white-space:nowrap}
.opt[aria-checked="true"]{color:var(--ribbon)}
.opt[aria-checked="true"] small::before{content:"✓ ";color:var(--ribbon)}

@media (max-width:820px){
  .hide-sm{display:none}
  .toc,.toc.collapsed{display:flex;position:absolute;z-index:5;top:0;bottom:0;left:0;width:min(320px,88%);box-sizing:border-box;
    background:var(--surface);padding:18px 16px;border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);
    transform:translateX(calc(-100% - 24px));visibility:hidden;transition:transform .2s ease-out,visibility 0s .2s}
  .toc.open{transform:none;visibility:visible;transition:transform .2s ease-out}
  .bar{gap:6px}
  .tools{gap:2px}
  .btn.ghost{padding:0 7px}
  .menu{position:fixed;top:auto;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
    bottom:calc(16px + env(safe-area-inset-bottom,0px));width:auto;max-width:none}
}
@media (max-width:520px){
  .bar{flex-wrap:wrap;row-gap:8px}
  .book-id{flex-basis:calc(100% - 60px)}
  .tools{width:100%;justify-content:space-between}
  .tools .btn.ghost{padding:0 5px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <button class="btn ghost" id="tocBtn" aria-controls="toc" aria-expanded="true" title="Show or hide contents (C)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h8"/></svg>
      <span class="hide-sm">Contents</span>
    </button>
    <div class="book-id"><span id="bookTitle">Loading…</span><span id="bookAuthor"></span></div>
    <div class="tools">
      <button class="btn ghost" id="ttsBtn" aria-pressed="false" title="Read aloud (R starts at your selection or the top of the page)" aria-label="Read aloud">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 6v4h2.5l3.5 3V3L5 6H2.5Z"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.5a6.2 6.2 0 0 1 0 9"/></svg>
      </button>
      <div class="font-pick">
        <button class="btn ghost" id="fontBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="fontMenu" title="Reading font">
          <span class="aa">Aa</span>
          <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m2 3.5 3 3 3-3"/></svg>
        </button>
        <div class="menu" id="fontMenu" role="menu" aria-label="Reading font" hidden>
          <p class="label">Reading font</p>
        </div>
      </div>
      <button class="btn ghost" id="themeBtn" title="Switch to dark mode" aria-label="Switch to dark mode">
        <svg class="i-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M13.5 9.6A5.75 5.75 0 0 1 6.4 2.5a5.75 5.75 0 1 0 7.1 7.1Z"/></svg>
        <svg class="i-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="2.75"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.06 1.06M11.54 11.54l1.06 1.06M3.4 12.6l1.06-1.06M11.54 4.46l1.06-1.06"/></svg>
      </button>
      <button class="btn ghost" id="fsBtn" title="Full screen (F)" aria-label="Full screen">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
      </button>
      <div class="size" role="group" aria-label="Text size">
        <button class="btn ghost" id="smaller" title="Smaller text" aria-label="Smaller text">A−</button>
        <span id="fontPct" class="hide-sm" aria-live="polite">100%</span>
        <button class="btn ghost" id="larger" title="Larger text" aria-label="Larger text">A+</button>
      </div>
      <div class="size" role="group" aria-label="Line spacing">
        <button class="btn ghost" id="tighter" title="Less space between lines" aria-label="Less space between lines">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 5.5h12M2 8h12M2 10.5h12"/></svg>
        </button>
        <span id="lineVal" class="readout hide-sm" aria-live="polite">1.65</span>
        <button class="btn ghost" id="looser" title="More space between lines" aria-label="More space between lines">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 2.5h12M2 8h12M2 13.5h12"/></svg>
        </button>
      </div>
      <label class="btn primary" for="fileInput" tabindex="0" id="openBtn">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 10V2M4.5 5.5 8 2l3.5 3.5M2.5 10v3.5h11V10"/></svg>
        <span>Open<span class="hide-sm"> EPUB</span></span>
      </label>
      <input type="file" id="fileInput" accept=".epub,application/epub+zip">
    </div>
  </header>

  <div class="main">
    <aside class="toc" id="toc" aria-label="Book contents">
      <div>
        <h1 class="meta-title" id="metaTitle"></h1>
        <p class="meta-authors" id="metaAuthors"></p>
        <details class="desc" id="metaDesc" hidden>
          <summary>Description</summary>
          <div id="metaDescBody"></div>
        </details>
      </div>
      <nav aria-labelledby="tocHead">
        <h2 class="label" id="tocHead">Contents</h2>
        <div id="tocList"></div>
      </nav>
      <section aria-labelledby="infoHead">
        <h2 class="label" id="infoHead">Information</h2>
        <dl class="pkg" id="infoList"></dl>
      </section>
    </aside>

    <section class="reader">
      <div class="notice" id="notice" hidden>
        <p id="noticeText"></p>
        <button class="btn" id="noticeAction"></button>
      </div>
      <iframe id="page" title="Book page" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
      <div class="tts" id="tts" role="region" aria-label="Read aloud" hidden>
        <button class="btn ghost" id="ttsPrev" title="Previous sentence" aria-label="Previous sentence">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 3v10M13 3 6.5 8l6.5 5V3Z"/></svg>
        </button>
        <button class="btn primary" id="ttsPlay" title="Play (Space)" aria-label="Play">
          <svg class="i-play" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M5 3v10l8-5-8-5Z"/></svg>
          <svg class="i-pause" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 3h3v10H4zM9 3h3v10H9z"/></svg>
        </button>
        <button class="btn ghost" id="ttsNext" title="Next sentence" aria-label="Next sentence">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 3v10M3 3l6.5 5L3 13V3Z"/></svg>
        </button>
        <label class="tts-speed" title="Speed ([ slower, ] faster)">
          <span class="readout" id="ttsRateVal">1.0×</span>
          <input type="range" id="ttsRate" min="0.5" max="2" step="0.1" value="1" aria-label="Reading speed">
        </label>
        <select id="ttsEngine" aria-label="What reads aloud">
          <option value="narration">Publisher narration</option>
          <option value="device">Device voice</option>
          <option value="kokoro">Natural voice (Kokoro)</option>
          <option value="pocket">Natural voice (Pocket TTS)</option>
          <option value="server" hidden>Server voice</option>
        </select>
        <select id="ttsVoice" aria-label="Voice"></select>
        <span id="ttsStatus" hidden></span>
        <button class="btn" id="ttsDownload" hidden>Download</button>
        <button class="btn" id="ttsBack" hidden title="Go back to the page being read">Back to reading</button>
        <button class="btn ghost" id="ttsClose" title="Stop reading aloud" aria-label="Stop reading aloud">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <div class="status" id="status" hidden></div>
    </section>
  </div>

  <footer class="foot">
    <button class="btn" id="prevBtn" title="Previous page (Left arrow)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><span class="hide-sm">Previous</span>
    </button>
    <div class="where">
      <div class="loc"><span id="chapLabel"></span><span class="mono"><span id="spinePos"></span> · <span id="pct">0%</span></span></div>
      <div class="ribbon" id="ribbon" role="progressbar" aria-label="Position in book" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0" title="Click to jump to a section"><div id="ribbonFill"></div></div>
    </div>
    <button class="btn" id="nextBtn" title="Next page (Right arrow)">
      <span class="hide-sm">Next</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg>
    </button>
  </footer>

  <div class="fs-pill" id="fsPill">
    <span class="mono" id="fsPos"></span>
    <button class="btn" id="fsExit" title="Exit full screen (Esc)">Exit full screen <kbd>Esc</kbd></button>
  </div>

  <div class="drop" id="drop" hidden><div>Drop the .epub to open it</div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const frame = $('#page');
const narrow = matchMedia('(max-width: 820px)');
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
const darkMq = matchMedia('(prefers-color-scheme: dark)');
const FONT_URL = 'https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap';
const GF = family => `https://fonts.googleapis.com/css2?family=${family}&display=swap`;
/* Reading fonts. "book" keeps the publisher's CSS (Literata where the book names no font);
   every other choice overrides the book's fonts except for code. */
const FONTS = [
  { id: 'book', name: "Book's own font", note: 'publisher', stack: null, preview: '"Literata", Georgia, serif' },

/* ---------- paths & parsing ---------- */
const ext = p => (p.split('.').pop() || '').toLowerCase();
const clean = t => (t || '').replace(/^﻿/, '');
const isExternal = h => /^[a-z][a-z0-9+.\-]*:/i.test(h);
const kids = (el, name) => el ? [...el.children].filter(c => c.localName === name) : [];
const textOf = el => (el?.textContent || '').replace(/\s+/g, ' ').trim();

function resolve(base, href){
  const hash = href.indexOf('#');
  const h = hash < 0 ? href : href.slice(0, hash);
  if (!h) return base;
  const enc = base.split('/').map(encodeURIComponent).join('/');
  const p = new URL(h, 'https://book.invalid/' + enc).pathname.slice(1);
  try { return decodeURIComponent(p); } catch { return p; }
}
function fragOf(href){
  const i = href.indexOf('#'); if (i < 0) return '';
  try { return decodeURIComponent(href.slice(i + 1)); } catch { return href.slice(i + 1); }
}
function getFile(zip, path){
  let f = zip.file(path);
  if (!f) {
    const low = path.toLowerCase();
    const name = Object.keys(zip.files).find(n => n.toLowerCase() === low);
    if (name) f = zip.file(name);
  }
  return f;
}
async function readText(src, path){ return src.text(path); }

/* A book source hides where files come from: a zip archive (uploaded file, fetched .epub, sample)
   or an already-extracted EPUB folder on the same web server. */
function zipSource(zip){
  const blobs = [];
  return {
    kind: 'zip',
    async text(p){ const f = getFile(zip, p); return f ? clean(await f.async('string')) : null; },
    async exists(p){ return !!getFile(zip, p); },
    async url(p, type){
      const f = getFile(zip, p); if (!f) return null;
      if (type.startsWith('font/')) return `data:${type};base64,` + await f.async('base64');
      const u = URL.createObjectURL(new Blob([await f.async('uint8array')], { type }));
      blobs.push(u); return u;
    },
    dispose(){ blobs.forEach(u => URL.revokeObjectURL(u)); }
  };
}
function dirSource(base){
  const abs = p => new URL(p.split('/').map(encodeURIComponent).join('/'), base).href;
  return {
    kind: 'dir',
    async text(p){
      try { const r = await fetch(abs(p)); return r.ok ? clean(await r.text()) : null; } catch { return null; }
    },
    async exists(){ return true; },
    async url(p){ return abs(p); },
    dispose(){}
  };
}
function parseDoc(text, type){
  const d = new DOMParser().parseFromString(text, type);
  if (type !== 'text/html' && d.getElementsByTagName('parsererror').length) return null;
  return d;
}

/* ---------- descriptive metadata ---------- */
const OPF_NS = 'http://www.idpf.org/2007/opf';
function readInfo(md, ids, spineEl){
  const all = n => md ? [...md.getElementsByTagNameNS('*', n)] : [];
  const metas = all('meta');
  const prop = (p, refines) => metas.filter(m => m.getAttribute('property') === p && (refines === undefined || m.getAttribute('refines') === refines));
  const named = n => metas.find(m => m.getAttribute('name') === n)?.getAttribute('content')?.trim() || '';
  const opfAttr = (el, a) => el.getAttributeNS(OPF_NS, a) || el.getAttribute('opf:' + a) || '';

  // Publication date: EPUB 2 may list several dates with opf:event; prefer "publication".
  const dates = all('date');
  const date = textOf(dates.find(d => /publication/i.test(opfAttr(d, 'event'))) || dates.find(d => !opfAttr(d, 'event')) || dates[0]);

  // ISBN: urn:isbn: prefix, opf:scheme="ISBN", EPUB 3 identifier-type refinement, or a bare 10/13-digit ISBN.
  let isbn = '';
  for (const el of ids) {
    const v = textOf(el), id = el.getAttribute('id');
    const typed = id && prop('identifier-type', '#' + id).some(m => /isbn/i.test(textOf(m)) || (m.getAttribute('scheme') === 'onix:codelist5' && textOf(m) === '15'));
    const bare = v.replace(/^urn:isbn:/i, '').replace(/^isbn:?\s*/i, '');
    if (/^urn:isbn:|^isbn/i.test(v) || /isbn/i.test(opfAttr(el, 'scheme')) || typed || /^(97[89]\d{10}|\d{9}[\dXx])$/.test(bare.replace(/[\s-]/g, ''))) { isbn = bare; break; }
  }

  // Series: EPUB 3 collections, then Calibre's metadata.
  let series = '';
  const coll = prop('belongs-to-collection', undefined).find(m => !m.getAttribute('refines'));
  if (coll) {
    const id = coll.getAttribute('id');
    const pos = id ? textOf(prop('group-position', '#' + id)[0]) : '';
    series = textOf(coll) + (pos ? `, book ${pos.replace(/\.0+$/, '')}` : '');
  } else if (named('calibre:series')) {
    const pos = named('calibre:series_index');
    series = named('calibre:series') + (pos ? `, book ${pos.replace(/\.0+$/, '')}` : '');
  }

  const layout = textOf(prop('rendition:layout', undefined).find(m => !m.getAttribute('refines'))) === 'pre-paginated' ? 'Fixed layout' : 'Reflowable';
  const dir = (spineEl?.getAttribute('page-progression-direction') || '').toLowerCase();

  return {
    publisher: textOf(all('publisher')[0]),
    published: formatDate(date),
    isbn,
    series,
    subjects: all('subject').map(textOf).filter(Boolean).join(', '),
    layout,
    direction: dir === 'rtl' ? 'Right to left' : 'Left to right',
    description: all('description')[0]?.textContent || '',
    narrator: prop('media:narrator', undefined).filter(m => !m.getAttribute('refines')).map(textOf).filter(Boolean).join(', '),
    duration: formatDuration(clock(textOf(prop('media:duration', undefined).find(m => !m.getAttribute('refines'))))),
    activeClass: textOf(prop('media:active-class', undefined)[0]) || '-epub-media-overlay-active',
    playbackClass: textOf(prop('media:playback-active-class', undefined)[0])
  };
}
/* SMIL clock values: "1:02:03.5", "02:03.5", "12.5s", "500ms", "2min", "1h", or plain seconds. */
function clock(v){
  v = (v || '').trim(); if (!v) return null;
  let m = /^(\d+):(\d{2}):(\d{2}(?:\.\d+)?)$/.exec(v); if (m) return +m[1] * 3600 + +m[2] * 60 + +m[3];
  m = /^(\d+):(\d{2}(?:\.\d+)?)$/.exec(v); if (m) return +m[1] * 60 + +m[2];
  m = /^(\d+(?:\.\d+)?)(h|min|s|ms)?$/.exec(v); if (!m) return null;
  return +m[1] * ({ h: 3600, min: 60, s: 1, ms: 0.001 }[m[2] || 's']);
}
function formatDuration(sec){
  if (sec == null || !(sec > 0)) return '';
  const h = Math.floor(sec / 3600), mi = Math.round((sec % 3600) / 60);
  return h ? `${h} h ${mi} min` : `${mi || 1} min`;
}
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
function formatDate(v){
  const m = /^(\d{4})(?:-(\d{2})(?:-(\d{2}))?)?/.exec(v || '');
  if (!m) return v || '';
  if (+m[1] < 1000) return '';                        // placeholder dates such as 0101-01-01
  if (!m[2]) return m[1];
  const d = new Date(+m[1], +m[2] - 1, +(m[3] || 1));
  return d.toLocaleDateString(undefined, m[3] ? { year: 'numeric', month: 'long', day: 'numeric' } : { year: 'numeric', month: 'long' });
}
/* Descriptions are often HTML (sometimes escaped). Keep only the text, split into paragraphs. */
function descriptionParagraphs(raw){
  let t = raw.trim(); if (!t) return [];
  if (/<[a-z!/]/i.test(t) || /&lt;[a-z/]/i.test(t)) {
    if (!/<[a-z!/]/i.test(t)) t = new DOMParser().parseFromString(t, 'text/html').body.textContent;
    t = t.replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div|li|h[1-6])>/gi, '\n\n');
    const d = new DOMParser().parseFromString(t, 'text/html');
    d.querySelectorAll('script,style,template,noscript').forEach(e => e.remove());
    t = d.body.textContent;
  }
  return t.split(/\n\s*\n/).map(x => x.replace(/\s+/g, ' ').trim()).filter(Boolean);
}

/* ---------- opening a book ---------- */
async function openBook(zip, { sample = false, name = '' } = {}){
  showStatus('Opening book…');
  const cText = await readText(zip, 'META-INF/container.xml');
  if (!cText) throw new Error(zip.kind === 'dir'
    ? "There's no META-INF/container.xml in that folder, so it isn't an extracted EPUB (or the path is wrong)."
    : "This file isn't an EPUB: it has no META-INF/container.xml.");
  const cDoc = parseDoc(cText, 'application/xml');
  const opfPath = cDoc?.getElementsByTagNameNS('*', 'rootfile')[0]?.getAttribute('full-path');
  if (!opfPath) throw new Error("container.xml doesn't point to a package (.opf) file.");
  const oText = await readText(zip, opfPath);
  if (!oText) throw new Error(`The package file ${opfPath} is missing from the archive.`);
  const opf = parseDoc(oText, 'application/xml');
  if (!opf) throw new Error(`The package file ${opfPath} isn't well-formed XML.`);

  const pkg = opf.documentElement;
  const md = opf.getElementsByTagNameNS('*', 'metadata')[0];
  const dc = n => md ? [...md.getElementsByTagNameNS('*', n)].map(textOf).filter(Boolean) : [];
  const ids = md ? [...md.getElementsByTagNameNS('*', 'identifier')] : [];
  const uidAttr = pkg.getAttribute('unique-identifier');
  const uid = textOf(ids.find(e => e.getAttribute('id') === uidAttr) || ids[0]);
  const info = readInfo(md, ids, opf.getElementsByTagNameNS('*', 'spine')[0]);

  const manifest = new Map(), byPath = new Map();
  for (const it of opf.getElementsByTagNameNS('*', 'item')) {
    const href = it.getAttribute('href'); if (!href) continue;
    const item = { id: it.getAttribute('id'), href, path: resolve(opfPath, href),
      type: (it.getAttribute('media-type') || '').toLowerCase(), props: (it.getAttribute('properties') || '').split(/\s+/),
      overlay: it.getAttribute('media-overlay') || '' };
    manifest.set(item.id, item); byPath.set(item.path, item);
  }
  const spineEl = opf.getElementsByTagNameNS('*', 'spine')[0];
  const spine = [];
  for (const ref of opf.getElementsByTagNameNS('*', 'itemref')) {
    const item = manifest.get(ref.getAttribute('idref'));
    if (item && await zip.exists(item.path)) spine.push({ ...item, linear: ref.getAttribute('linear') !== 'no' });
  }
  if (!spine.length) throw new Error('The package lists no readable files in its spine, so there is nothing to show.');

  const next = { zip, src: zip, opfPath, version: pkg.getAttribute('version') || '?', title: dc('title')[0] || name || 'Untitled',
    authors: dc('creator'), language: dc('language')[0] || '', uid, info, manifest, byPath, spine, urls: new Map(), sample };
  next.toc = await loadToc(next, spineEl);
  next.hasOverlays = spine.some(s => s.overlay);
  next.key = 'spine:pos:' + (uid || next.title);

  if (book) book.src.dispose();
  book = next;
  renderMeta(); renderToc();
  if (sample) showNotice('This is a built-in sample book. Open an .epub file, or drop one anywhere on the page, to read your own.', 'info');
  else hideNotice();

  const saved = store.get(book.key);
  const i = saved && saved.i < spine.length ? saved.i : 0;
  await renderChapter(i, { fraction: saved?.f || 0 });
}

async function loadToc(b, spineEl){
  const all = [...b.manifest.values()];
  const nav = all.find(i => i.props.includes('nav'));
  if (nav) {
    const t = await readText(b.zip, nav.path);
    const toc = t && parseNav(t, nav.path);
    if (toc?.length) return toc;
  }
  const ncxId = spineEl?.getAttribute('toc');
  const ncx = (ncxId && b.manifest.get(ncxId)) || all.find(i => i.type === 'application/x-dtbncx+xml');
  if (ncx) {
    const t = await readText(b.zip, ncx.path);
    const toc = t && parseNcx(t, ncx.path);
    if (toc?.length) return toc;
  }
  return b.spine.map(s => ({ label: s.href.split('/').pop().replace(/\.x?html?$/i, ''), path: s.path, frag: '', children: [] }));
}
function parseNav(text, path){
  const doc = parseDoc(text, 'application/xhtml+xml') || parseDoc(text, 'text/html');
  const navs = [...doc.getElementsByTagNameNS('*', 'nav')];
  const kind = n => n.getAttributeNS(OPS, 'type') || n.getAttribute('epub:type') || '';
  const nav = navs.find(n => /\btoc\b/.test(kind(n))) || navs[0];
  if (!nav) return null;
  const ol = kids(nav, 'ol')[0] || nav.getElementsByTagNameNS('*', 'ol')[0];
  const walk = list => kids(list, 'li').map(li => {
    const a = kids(li, 'a')[0] || kids(li, 'span')[0];
    const href = a?.getAttribute('href') || '';
    const sub = kids(li, 'ol')[0];
    return { label: textOf(a) || 'Untitled', path: href ? resolve(path, href) : null, frag: href ? fragOf(href) : '', children: sub ? walk(sub) : [] };
  });
  return ol ? walk(ol) : null;
}
function parseNcx(text, path){
  const doc = parseDoc(text, 'application/xml'); if (!doc) return null;
  const map = doc.getElementsByTagNameNS('*', 'navMap')[0]; if (!map) return null;
  const walk = el => kids(el, 'navPoint').map(np => {
    const src = kids(np, 'content')[0]?.getAttribute('src') || '';
    return { label: textOf(kids(np, 'navLabel')[0]) || 'Untitled', path: src ? resolve(path, src) : null, frag: fragOf(src), children: walk(np) };
  });
  return walk(map);
}

/* ---------- resources ---------- */
function typeOf(path){ return book.byPath.get(path)?.type || MIME[ext(path)] || 'application/octet-stream'; }
function resourceURL(path){
  if (book.urls.has(path)) return book.urls.get(path);
  let type = typeOf(path);
  if ((['ttf','otf','woff','woff2'].includes(ext(path)) || /font|opentype/.test(type)) && !type.startsWith('font/')) type = 'font/' + (ext(path) || 'ttf');
  const job = book.src.url(path, type);
  book.urls.set(path, job);
  return job;
}
const URL_RE = /url\(\s*(['"]?)(.*?)\1\s*\)/g;
async function rewriteCss(css, cssPath, depth = 0){
  for (const m of [...css.matchAll(/@import\s+(?:url\(\s*)?(['"]?)([^'")\s;]+)\1\s*\)?[^;]*;/g)]) {
    let inner = '';
    if (depth < 4 && !isExternal(m[2])) {
      const p = resolve(cssPath, m[2]); const t = await readText(book.zip, p);
      if (t) inner = await rewriteCss(t, p, depth + 1);
    }
    css = css.replace(m[0], () => inner);
  }
  const found = new Map();
  for (const m of css.matchAll(URL_RE)) {
    const ref = m[2].trim();
    if (!ref || isExternal(ref) || ref.startsWith('#') || found.has(ref)) continue;
    found.set(ref, resourceURL(resolve(cssPath, ref)));
  }
  const done = new Map();
  for (const [k, v] of found) done.set(k, await v);
  return css.replace(URL_RE, (all, q, ref) => { const u = done.get(ref.trim()); return u ? `url("${u}")` : all; });
}

/* ---------- building a page ---------- */
function isDark(){
  const t = document.documentElement.getAttribute('data-theme');
  return t ? t === 'dark' : darkMq.matches;
}
function tokens(){
  const cs = getComputedStyle(document.documentElement);
  const v = n => cs.getPropertyValue(n).trim();
  return { bg: v('--page-bg'), ink: v('--page-ink'), ribbon: v('--ribbon'), onRibbon: v('--on-ribbon'), soft: v('--ribbon-soft'), rule: v('--rule') };
}
function baseCss(){
  const t = tokens();
  return `body{font-family:"Literata",Georgia,"Times New Roman",serif;font-size:1.0625rem;line-height:1.65;color:${t.ink};overflow-wrap:break-word}
h1,h2,h3{line-height:1.25;text-wrap:balance}
a{color:${t.ribbon}}`;
}
/* Paged layout: body is a fixed-size viewport; #spine-clip hides everything outside the text area;
   #spine-flow lays the chapter out in columns that overflow sideways, and a page turn translates it
   by exactly one screen (flow width + one column gap). */
function overrideCss(){
  const t = tokens(), dark = isDark();
  return `html{font-size:${fontPct}% !important;background:${t.bg} !important;color-scheme:${dark ? 'dark' : 'light'};height:100% !important;overflow:hidden !important}
body{--v:40px;--vb:${40 + tts.barH}px;--m:max(20px,3.5vw,calc((100vw - 1240px) / 2));--g:max(32px,4vw);
  margin:0 !important;padding:var(--v) var(--m) var(--vb) !important;height:100vh !important;width:auto !important;max-width:none !important;min-height:0 !important;
  box-sizing:border-box !important;overflow:hidden !important;background:transparent !important;${dark ? `color:${t.ink} !important;` : ''}}
#spine-clip{height:100%;overflow:hidden}
#spine-flow{height:100%;column-count:2;column-gap:var(--g);column-fill:auto;column-rule:1px solid ${t.rule};overflow-wrap:break-word}
@media (max-width:640px){#spine-flow{column-count:1}}
#spine-flow{line-height:${lineH} !important}
#spine-flow :is(p,li,blockquote,dd,dt,td,th,div,span,a,em,strong,i,b,small,cite,q,sup,sub,section,article,aside){line-height:inherit !important}
#spine-flow :is(h1,h2,h3,h4,h5,h6){line-height:${Math.max(1.15, lineH * 0.78).toFixed(2)} !important}
img,svg,video,canvas{max-width:100% !important;max-height:calc(100vh - var(--v) - var(--vb) - 8px) !important;height:auto;object-fit:contain;break-inside:avoid}
figure,table{break-inside:avoid}
pre{white-space:pre-wrap !important}
#spine-end{display:inline}
::highlight(tts-sentence){background-color:${t.soft}}
::highlight(tts-word){background-color:${t.ribbon};color:${t.onRibbon}}
${faceStack() ? `#spine-flow,#spine-flow :not(pre):not(code):not(kbd):not(samp):not(tt):not(svg):not(svg *):not(math):not(math *){font-family:${faceStack()} !important}` : ''}
::selection{background:${t.soft}}
${dark ? `body *:not(svg):not(svg *){color:inherit !important;background-color:transparent !important;border-color:${t.rule} !important}
a,a *{color:${t.ribbon} !important}` : ''}`;
}

function sanitize(doc){
  doc.querySelectorAll('script,object,embed,iframe,frame,frameset,base,meta[http-equiv]').forEach(e => e.remove());
  for (const el of doc.body.querySelectorAll('*')) {
    for (const a of [...el.attributes]) {
      if (/^on/i.test(a.name)) el.removeAttribute(a.name);
      else if (/^(href|src|xlink:href|action|formaction)$/i.test(a.name) && /^\s*javascript:/i.test(a.value)) el.removeAttribute(a.name);
    }
  }
}
async function localize(doc, path){
  const jobs = [];
  const targets = [['img','src'],['image','href'],['image','xlink:href'],['source','src'],['video','src'],['video','poster'],['audio','src'],['track','src']];
  for (const [tag, attr] of targets) {
    for (const el of doc.getElementsByTagName(tag)) {
      const v = el.getAttribute(attr);
      if (!v || isExternal(v) || v.startsWith('#')) continue;
      jobs.push(resourceURL(resolve(path, v)).then(u => { if (u) el.setAttribute(attr, u); }));
    }
  }
  doc.querySelectorAll('img[srcset],source[srcset]').forEach(el => el.removeAttribute('srcset'));
  for (const st of doc.body.getElementsByTagName('style')) jobs.push(rewriteCss(st.textContent, path).then(c => { st.textContent = c; }));
  for (const el of doc.body.querySelectorAll('[style*="url("]')) jobs.push(rewriteCss(el.getAttribute('style'), path).then(c => el.setAttribute('style', c)));
  await Promise.all(jobs);
}
function markLinks(doc, path){
  for (const a of doc.querySelectorAll('a[href]')) {
    const h = a.getAttribute('href').trim();
    if (/^(https?|mailto|tel):/i.test(h)) { a.setAttribute('target', '_blank'); a.setAttribute('rel', 'noopener'); }
    else if (isExternal(h)) a.removeAttribute('href');
    else { a.setAttribute('data-spine-path', h.startsWith('#') ? path : resolve(path, h)); a.setAttribute('data-spine-frag', fragOf(h)); }
  }
}

async function buildPage(src, path){
  const out = document.implementation.createHTMLDocument('');
  const sHtml = src.documentElement;
  const sHead = src.getElementsByTagNameNS('*', 'head')[0];
  const sBody = src.getElementsByTagNameNS('*', 'body')[0];
  for (const a of ['lang', 'xml:lang', 'dir', 'class']) {
    const v = sHtml.getAttribute(a); if (v) out.documentElement.setAttribute(a === 'xml:lang' ? 'lang' : a, v);
  }
  const head = out.head;
  head.innerHTML = `<meta charset="utf-8"><link id="spine-font" rel="stylesheet" href="${fontHref()}"><style id="spine-base"></style>`;
  head.querySelector('#spine-base').textContent = baseCss();
  for (const n of kids(sHead, 'link').concat(kids(sHead, 'style')).sort((x, y) => x.compareDocumentPosition(y) & 2 ? 1 : -1)) {
    if (n.localName === 'link') {
      const rel = n.getAttribute('rel') || '', href = n.getAttribute('href');
      if (!/stylesheet/i.test(rel) || /alternate/i.test(rel) || !href || isExternal(href)) continue;
      const p = resolve(path, href), css = await readText(book.zip, p);
      if (!css) continue;
      const st = out.createElement('style'); st.textContent = await rewriteCss(css, p);
      if (n.getAttribute('media')) st.setAttribute('media', n.getAttribute('media'));
      head.append(st);
    } else {
      const st = out.createElement('style'); st.textContent = await rewriteCss(n.textContent, path); head.append(st);
    }
  }
  const ov = out.createElement('style'); ov.id = 'spine-override'; ov.textContent = overrideCss(); head.append(ov);
  if (sBody) {
    for (const a of [...sBody.attributes]) if (!/^on/i.test(a.name) && !a.name.includes(':')) out.body.setAttribute(a.name, a.value);
  }
  const clip = out.createElement('div'); clip.id = 'spine-clip';
  const flow = out.createElement('div'); flow.id = 'spine-flow';
  if (sBody) for (const c of [...sBody.childNodes]) flow.append(out.importNode(c, true));
  const end = out.createElement('span'); end.id = 'spine-end'; flow.append(end);
  clip.append(flow); out.body.append(clip);
  sanitize(out);
  await localize(out, path);
  markLinks(out, path);
  return '<!doctype html>\n' + out.documentElement.outerHTML;
}

function loadFrame(html){
  return new Promise(res => {
    const t = setTimeout(res, 6000);
    frame.addEventListener('load', () => { clearTimeout(t); res(); }, { once: true });
    frame.srcdoc = html;
  });
}

async function renderChapter(i, { frag = '', fraction = 0 } = {}){
  if (!book) return;
  i = Math.max(0, Math.min(book.spine.length - 1, i));
  const token = ++renderToken;
  ttsBeforeRender();
  const item = book.spine[i];
  cur = { i, page: 0, pages: 1, f: fraction };
  updateChrome();
  try {
    const raw = await readText(book.zip, item.path) || '';
    const isHtml = item.type === 'text/html' || /\.html?$/i.test(item.path);
    const src = (!isHtml && parseDoc(raw, 'application/xhtml+xml')) || parseDoc(raw, 'text/html');
    const html = await buildPage(src, item.path);
    if (token !== renderToken) return;
    await loadFrame(html);
    if (token !== renderToken) return;
    wireFrame();
    const fonts = frame.contentDocument.fonts;
    if (fonts) await Promise.race([fonts.ready, new Promise(r => setTimeout(r, 1500))]);
    if (token !== renderToken) return;
    position(frag, fraction);
    hideStatus();
    ttsAfterRender();
  } catch (err) {
    if (token !== renderToken) return;
    hideStatus();
    showNotice(`Couldn't display ${item.href}: ${err.message}`, 'error');
  }
}

/* ---------- inside the frame ---------- */
/* Measure the column layout: one page = flow width + one column gap. The #spine-end marker sits
   after the last content, so its offset from the flow's left edge says which page is the last. */
function geom(){
  const doc = frame.contentDocument, win = frame.contentWindow;
  const flow = doc?.getElementById('spine-flow'), end = doc?.getElementById('spine-end');
  if (!flow || !end) return null;
  const step = flow.clientWidth + (parseFloat(win.getComputedStyle(flow).columnGap) || 0);
  if (!(step > 0)) return null;
  const left = flow.getBoundingClientRect().left;
  const pages = Math.max(1, Math.floor((end.getBoundingClientRect().left - left + 1) / step) + 1);
  return { doc, flow, step, pages, left };
}
function fraction(){ return cur.pages > 1 ? cur.page / (cur.pages - 1) : 0; }
function showPage(n){
  const g = geom(); if (!g) return;
  cur.pages = g.pages;
  cur.page = Math.max(0, Math.min(g.pages - 1, n));
  g.flow.style.transform = `translateX(${-Math.round(cur.page * g.step)}px)`;
  cur.f = fraction();
  updateProgress(); savePos();
}
function position(frag, f){
  const g = geom(); if (!g) return;
  const el = frag && (g.doc.getElementById(frag) || g.doc.getElementsByName(frag)[0]);
  if (el) showPage(Math.floor((el.getBoundingClientRect().left - g.left + 1) / g.step));
  else showPage(Math.round((f || 0) * (g.pages - 1)));
}
function relayout(){ if (book && cur.f != null) { position('', cur.f); ttsRefollow(); } }
function savePos(){ if (book) store.set(book.key, { i: cur.i, f: Math.round(fraction() * 1000) / 1000 }); }

let wheelAcc = 0, wheelAt = 0;
function onWheel(e){
  e.preventDefault();
  const now = performance.now();
  if (now - wheelAt < 450) return;
  wheelAcc += Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  if (Math.abs(wheelAcc) > 40) { wheelAcc > 0 ? pageNext() : pagePrev(); wheelAcc = 0; wheelAt = now; }
}
function wireFrame(){
  const doc = frame.contentDocument; if (!doc) return;
  doc.addEventListener('click', onFrameClick);
  doc.addEventListener('keydown', onKey);
  doc.addEventListener('wheel', onWheel, { passive: false });
  doc.addEventListener('dragenter', onDragEnter);
  doc.addEventListener('dragover', onDragOver);
  // Focus or text selection can scroll the clipped area; pages move only by transform, so undo it.
  doc.addEventListener('scroll', e => {
    const t = e.target.nodeType === 9 ? e.target.scrollingElement : e.target;
    if (t && (t.scrollLeft || t.scrollTop)) { t.scrollLeft = 0; t.scrollTop = 0; }
  }, true);
  let tx = 0, ty = 0;
  doc.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  doc.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) dx < 0 ? pageNext() : pagePrev();
  }, { passive: true });
  doc.fonts?.addEventListener?.('loadingdone', relayout);
  doc.addEventListener('mousemove', wake);
  doc.addEventListener('pointerdown', () => setMenu(false));
  doc.addEventListener('touchstart', wake, { passive: true });
}

/* Full-screen mode: CSS hides the chrome; the browser's Fullscreen API is used too when allowed.
   Leaving native full screen (the browser handles Esc itself there) also leaves the mode. */
const isFs = () => $('.app').classList.contains('fs');
let wakeTimer = 0;
function wake(){
  if (!isFs()) return;
  $('.app').classList.add('awake');
  clearTimeout(wakeTimer);
  wakeTimer = setTimeout(() => $('.app').classList.remove('awake'), 2500);
}
function setFs(on){
  $('.app').classList.toggle('fs', on);
  $('#fsBtn').setAttribute('aria-pressed', String(on));
  if (on) {
    document.documentElement.requestFullscreen?.().catch(() => {});
    wake();
  } else {
    $('.app').classList.remove('awake');
    if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  }
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && isFs()) setFs(false); });
function onFrameClick(e){
  const a = e.target.closest?.('a[data-spine-path]');
  if (!a) { ttsClickStart(e); return; }
  e.preventDefault();
  goTo(a.getAttribute('data-spine-path'), a.getAttribute('data-spine-frag'));
}
function goTo(path, frag = ''){
  const idx = book.spine.findIndex(s => s.path === path);
  if (idx < 0) { showNotice(`That link points to ${path}, which isn't part of the book's reading order.`, 'error'); return; }
  if (idx === cur.i && frame.contentDocument) { position(frag, 0); return; }
  renderChapter(idx, { frag });
}
function restyleFrame(){
  const doc = frame.contentDocument; if (!doc) return;
  const b = doc.getElementById('spine-base'), o = doc.getElementById('spine-override');
  if (b) b.textContent = baseCss();
  if (o) o.textContent = overrideCss();
  const l = doc.getElementById('spine-font'), h = fontHref();
  if (l && l.getAttribute('href') !== h) {
    l.addEventListener('load', () => (doc.fonts?.ready || Promise.resolve()).then(relayout), { once: true });
    l.setAttribute('href', h);
  }
  relayout();
}

function pageNext(){
  if (!book) return;
  ttsUserNav();
  if (cur.page < cur.pages - 1) showPage(cur.page + 1);
  else if (cur.i < book.spine.length - 1) renderChapter(cur.i + 1);
}
function pagePrev(){
  if (!book) return;
  ttsUserNav();
  if (cur.page > 0) showPage(cur.page - 1);
  else if (cur.i > 0) renderChapter(cur.i - 1, { fraction: 1 });
}
function onKey(e){
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (menuOpen() && menuKey(e)) return;
  if (e.key === ' ' && tts.open && tag !== 'button' && tag !== 'a') { e.preventDefault(); ttsTogglePlay(); return; }
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); ttsReadHere(); return; }
  if (e.key === '[' || e.key === ']') { if (tts.open) { e.preventDefault(); ttsSetRate(tts.rate + (e.key === ']' ? 0.1 : -0.1)); } return; }
  if (e.key === 'Escape' && isFs()) { e.preventDefault(); setFs(false); }
  else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); setFs(!isFs()); }
  else if (e.key === 't' || e.key === 'T') { e.preventDefault(); setTheme(isDark() ? 'light' : 'dark'); }
  else if ((e.key === 'c' || e.key === 'C') && !isFs()) { e.preventDefault(); setToc(!tocIsOpen()); }
  else if (['ArrowRight', 'ArrowDown', 'PageDown'].includes(e.key)) { e.preventDefault(); pageNext(); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); pagePrev(); }
}

/* ---------- chrome ---------- */
function renderMeta(){
  document.title = book.title;
  $('#metaTitle').textContent = book.title;
  $('#metaAuthors').textContent = book.authors.join(', ');
  const i = book.info;
  const paras = descriptionParagraphs(i.description);
  $('#metaDescBody').replaceChildren(...paras.map(t => { const p = document.createElement('p'); p.textContent = t; return p; }));
  $('#metaDesc').hidden = !paras.length;
  $('#metaDesc').open = false;
  const rows = [
    ['Publisher', i.publisher], ['Published', i.published], ['ISBN', i.isbn], ['Series', i.series],
    ['Subjects', i.subjects], ['Narrator', i.narrator], ['Narration', i.duration], ['Language', book.language], ['Layout', i.layout], ['Direction', i.direction],
    ['EPUB', book.version], ['Spine', plural(book.spine.length, 'item')], ['Manifest', plural(book.manifest.size, 'item')],
    ['Package', book.opfPath], ['Showing', '', 'curFile'], ['ID', book.uid]
  ].filter(([, v, id]) => v || id);
  $('#infoList').replaceChildren(...rows.flatMap(([k, v, id]) => {
    const dt = document.createElement('dt'), dd = document.createElement('dd');
    dt.textContent = k; dd.textContent = v; if (id) dd.id = id;
    return [dt, dd];
  }));
  const r = $('#ribbon');
  r.style.setProperty('--n', book.spine.length);
  r.classList.toggle('dense', book.spine.length > 80);
}
function renderToc(){
  const build = list => {
    const ol = document.createElement('ol');
    for (const e of list) {
      const li = document.createElement('li');
      const el = document.createElement(e.path ? 'a' : 'span');
      el.textContent = e.label;
      if (e.path) { el.href = '#'; el.dataset.path = e.path; el.dataset.frag = e.frag; }
      li.append(el);
      if (e.children.length) li.append(build(e.children));
      ol.append(li);
    }
    return ol;
  };
  $('#tocList').replaceChildren(build(book.toc));
}
function tocLinkFor(path){
  const list = $('#tocList');
  const depth = a => { let d = 0; for (let p = a; p && p !== list; p = p.parentElement) if (p.tagName === 'OL') d++; return d; };
  const hits = [...list.querySelectorAll('a[data-path]')].filter(a => a.dataset.path === path);
  hits.sort((x, y) => (!!x.dataset.frag - !!y.dataset.frag) || (depth(y) - depth(x)));
  return hits[0] || null;
}
function updateChrome(){
  const n = book.spine.length, item = book.spine[cur.i];
  $('#bookTitle').textContent = book.title;
  $('#bookAuthor').textContent = book.authors.join(', ');
  let link = null;
  for (let j = cur.i; j >= 0 && !link; j--) link = tocLinkFor(book.spine[j].path);
  $('#chapLabel').textContent = link ? link.textContent : item.href.split('/').pop();
  $('#curFile').textContent = item.path;
  $('#tocList').querySelectorAll('a[aria-current]').forEach(a => a.removeAttribute('aria-current'));
  if (link) { link.setAttribute('aria-current', 'true'); link.scrollIntoView({ block: 'nearest' }); }
  updateProgress();
}
function updateProgress(){
  if (!book) return;
  const overall = (cur.i + fraction()) / book.spine.length;
  const pct = Math.round(overall * 100);
  $('#ribbonFill').style.width = (overall * 100).toFixed(2) + '%';
  $('#ribbon').setAttribute('aria-valuenow', pct);
  $('#pct').textContent = pct + '%';
  const n = book.spine.length;
  $('#spinePos').textContent = `page ${cur.page + 1}/${cur.pages} · spine ${cur.i + 1}/${n}`;
  $('#fsPos').textContent = `page ${cur.page + 1}/${cur.pages} · ${pct}%`;
  $('#prevBtn').disabled = cur.i === 0 && cur.page === 0;
  $('#nextBtn').disabled = cur.i === n - 1 && cur.page >= cur.pages - 1;
}
function showStatus(msg){ const s = $('#status'); s.textContent = msg; s.hidden = false; }
function hideStatus(){ $('#status').hidden = true; }
let noticeKind = '';
function showNotice(msg, kind){

  $('#notice').hidden = false;
}
function hideNotice(){ $('#notice').hidden = true; }
function friendly(err, name){
  const m = String(err?.message || err);
  if (/central directory|zip/i.test(m) && !/EPUB/.test(m)) return `${name} couldn't be read as a ZIP archive. EPUB files are ZIP archives, so this probably isn't an EPUB.`;
  return `${name} couldn't be opened. ${m}`;
}

async function openFile(file){
  if (!file) return;
  try { await openBook(zipSource(await JSZip.loadAsync(await file.arrayBuffer())), { name: file.name.replace(/\.epub$/i, '') }); }
  catch (err) { hideStatus(); showNotice(friendly(err, file.name), 'error'); }
}

function menuKey(e){

  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {

}

    k.state = 'error'; k.error = e.message; k.worker?.terminate(); k.worker = null;
  }
  ttsUpdateBar();
  nLoaded(k);
}
// If generation can't keep up with playback, say why there are pauses (once).
function kSpeedCheck(ratio, ne){
  const st = ne.st;
  if (st.slowWarned || !(ratio > 0)) return;
  (st.ratios ??= []).push(ratio);
  if (st.ratios.length < 3) return;
  const med = [...st.ratios].sort((a, b) => a - b)[Math.floor(st.ratios.length / 2)];
  if (med > 1.15) {
    st.slowWarned = true;
    if (ne === NEURAL.server) showNotice('The voice server is generating speech slower than it plays, so there will be pauses between paragraphs.', 'error');
    else if (ne === NEURAL.pocket) showNotice('Pocket TTS runs on this device\'s CPU and is generating speech slower than it speaks, so there will be pauses between sentences. Device voice has no pauses.', 'error');
    else showNotice(k.device === 'wasm'
      ? 'The natural voice is running on this device\'s CPU and generates speech slower than it speaks, so there will be pauses between sentences. A browser with WebGPU (recent Chrome or Edge) runs it much faster; Device voice has no pauses.'
      : 'The natural voice is generating speech slower than it speaks on this device, so there will be pauses between sentences. Device voice has no pauses.', 'error');
  }
}
// Kokoro: generate one piece of text at the current voice and speed (serialized in its worker).
function kGenerate(text){
  const id = k.nextId++;
  const job = new Promise((res, rej) => k.pending.set(id, { res, rej }));
  k.worker.postMessage({ type: 'generate', id, text, voice: k.voice, speed: tts.rate });
  return job.then(m => ({ data: m.data, rate: m.rate, genSec: m.ms / 1000 }));
}

/* ---------- Pocket TTS ----------
   Kyutai's Pocket TTS through pocket-tts-js 0.1.0: its own worker (imported into a small module worker
   from ./pocket/lib/ or the CDN) runs the int8 ONNX models on onnxruntime-web 1.20 (WebAssembly; threads
   only when the page is cross-origin isolated). One model bundle per language, each with 8 built-in
   voices. It has no speed control, so speed is applied at playback with pitch preserved. */
const POCKET = {
  lib: 'https://cdn.jsdelivr.net/npm/pocket-tts-js@0.1.0/src/',
  ort: 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.0/dist/',
  model: 'https://huggingface.co/vlapky/pocket-tts-onnx/resolve/c469236dbc5f68287fa2fbf175b66de3b80123af/onnx',
  // Self-hosted copies (fetched by fetch-pocket.sh): pocket/lib/, pocket/ort/, pocket/model/<bundle>/
  local: new URL('pocket/', location.href).href
};
const POCKET_LANGS = {   // book language -> [model bundle, MB to download (full precision, int8), name]
  en: ['english_2026-04', [431, 170], 'English'], fr: ['french_24l', [1247, 338], 'French'], de: ['german', [431, 170], 'German'],
  it: ['italian', [431, 170], 'Italian'], pt: ['portuguese', [431, 170], 'Portuguese'], es: ['spanish', [431, 170], 'Spanish']
};
const pocketMB = () => POCKET_LANGS[bookLang().toLowerCase().split(/[-_]/)[0]]?.[1][FULL_PRECISION ? 0 : 1] || 431;
const pocketLang = () => POCKET_LANGS[bookLang().toLowerCase().split(/[-_]/)[0]]?.[0] || null;
const pk = { state: 'idle', worker: null, lang: '', voices: [], refs: new Map(), pending: new Map(), nextId: 1, queue: Promise.resolve(),
  collect: null, files: {}, progressText: '', error: '', wantPlay: false, voice: store.get('spine:pocketVoice') || '' };
const pkReady = () => pk.state === 'ready' && pk.lang === pocketLang();
const pkVoice = () => pk.voices.includes(pk.voice) ? pk.voice : pk.voices[0];
function pkWorker(lib){
  const w = new Worker(URL.createObjectURL(new Blob([`import ${JSON.stringify(lib + 'worker.js')};`], { type: 'text/javascript' })), { type: 'module' });
  w.onmessage = ({ data: m }) => {
    if (m.type === 'progress') { if (m.label && m.total) pk.files[m.label] = { loaded: m.loaded || 0, total: m.total }; pkProgress(); }
    else if (m.type === 'ready') pk.bundle = m.bundle;
    else if (m.type === 'chunk') pk.collect?.push(m.audio);
    else if (m.type === 'result' || m.type === 'error') {
      const job = pk.pending.get(m.id); pk.pending.delete(m.id);
      if (m.type === 'result') job?.res(m.result); else job?.rej(new Error(m.error));

  w.onerror = e => { for (const j of pk.pending.values()) j.rej(new Error(e.message || 'the worker failed to start')); pk.pending.clear(); };

}
function pkRequest(type, payload){
  const id = pk.nextId++;
  return new Promise((res, rej) => { pk.pending.set(id, { res, rej }); pk.worker.postMessage({ id, type, payload }); });
}
function pkProgress(){
  const fs = Object.values(pk.files), total = fs.reduce((a, f) => a + f.total, 0), loaded = fs.reduce((a, f) => a + Math.min(f.loaded, f.total), 0);
  const expect = pocketMB();
  pk.progressText = total > 2e6 ? `Downloading Pocket TTS${pk.local ? ' from this site' : ''}… ${Math.round(loaded / 1048576)} of ~${expect} MB` : 'Loading Pocket TTS…';
  if (tts.open) ttsUpdateBar();
}
async function pkLoad(){
  const lang = pocketLang();
  if (!lang || pk.state === 'loading' || pkReady()) return;
  pk.state = 'loading'; pk.files = {}; pk.progressText = ''; ttsUpdateBar();
  const has = async f => { try { return (await fetch(POCKET.local + f, { method: 'HEAD', cache: 'no-store' })).ok; } catch { return false; } };
  const [lib, ort, model] = await Promise.all([has('lib/worker.js'), has('ort/ort.min.mjs'), has(`model/${lang}/bundle.json`)]);
  pk.local = lib || ort || model;
  try {
    pk.worker?.terminate(); pk.pending.clear(); pk.refs.clear(); pk.queue = Promise.resolve();
    pk.worker = pkWorker(lib ? POCKET.local + 'lib/' : POCKET.lib);
    await pkRequest('init', { language: lang, quantized: !FULL_PRECISION, voiceCloning: false,
      modelBaseUrl: model ? POCKET.local + 'model' : POCKET.model, ortBaseUrl: ort ? POCKET.local + 'ort/' : POCKET.ort,
      voicesUrl: null, maxThreads: 8, cache: true, cacheName: 'pocket-tts-js-v1' });
    pk.voices = pk.bundle?.predefinedVoices || [];
    pk.state = 'ready'; pk.lang = lang;
  } catch (e) {
    pk.state = 'error'; pk.error = e.message; pk.worker?.terminate(); pk.worker = null;
  }
  ttsFillVoices(); nLoaded(pk);
}
// Pocket TTS: generate one piece of text with the chosen built-in voice (one request at a time).
function pkGenerate(text){
  const run = async () => {
    const v = pkVoice();
    if (!pk.refs.has(v)) pk.refs.set(v, (await pkRequest('loadBuiltinVoice', { name: v })).ref);
    pk.collect = [];
    const t0 = performance.now();
    try { await pkRequest('generate', { text, voiceRef: pk.refs.get(v) }); }
    finally { var parts = pk.collect; pk.collect = null; }
    const data = new Float32Array(parts.reduce((a, p) => a + p.length, 0));
    let at = 0; for (const p of parts) { data.set(p, at); at += p.length; }
    return { data, rate: pk.bundle.sampleRate, genSec: (performance.now() - t0) / 1000 };
  };
  const job = pk.queue.then(run, run);
  pk.queue = job.catch(() => {});
  return job;
}

/* ---------- Server voice ----------
   A text-to-speech API on this same site (https://github.com/jskenney/epub-reader-tts-server): Breeze TTS 2 behind a reverse
   proxy at /tts/ on the site root, with voices listed in ./tts-voices/ next to this page. Each voice is a reference clip plus
   its transcript, sent with every request so the voice stays the same from paragraph to paragraph.
   The API runs one request at a time and answers 409 while busy, so requests are queued here and
   retried. It has no speed control: speed is applied at playback with pitch preserved. */
const TTS_SERVER = { api: new URL('/tts/', location.href).href, voices: new URL('tts-voices/', location.href).href };
const sv = { state: 'idle', available: null, voices: [], refs: new Map(), queue: Promise.resolve(), error: '', progressText: '',
  wantPlay: false, voice: store.get('spine:serverVoice') || '' };
const serverFits = () => /^(en|zh)\b/i.test(bookLang());
const svVoice = () => sv.voices.find(v => v.id === sv.voice) || sv.voices[0];
// Is there a voice server? Checked once, when the read-aloud bar first opens.
function svProbe(){
  sv.probe ??= (async () => {
    try { sv.available = (await fetch(TTS_SERVER.api + 'health', { cache: 'no-store' })).ok; } catch { sv.available = false; }
    if (tts.open) ttsUpdateBar();
  })();
  return sv.probe;
}
async function svLoad(){
  if (sv.state === 'loading') return;
  sv.state = 'loading'; sv.progressText = 'Connecting to the voice server…';
  try {
    const r = await fetch(TTS_SERVER.voices + 'voices.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status === 404 ? 'no voices yet (create one with make-voice.sh from epub-reader-tts-server)' : `the voice list answered ${r.status}`);
    const list = (await r.json()).voices || [];
    sv.voices = list.filter(v => v.id && (v.ref_audio ? v.ref_text : v.instruction));
    if (!sv.voices.length) throw new Error('no voices yet (create one with make-voice.sh from epub-reader-tts-server)');
    sv.state = 'ready';
  } catch (e) { sv.state = 'error'; sv.error = e.message; }
  ttsFillVoices(); nLoaded(sv);
}
// The model reads "(sigh)" and "[laugh]" as performed vocal events; a book's parentheses should be read.
const svText = t => t.replace(/\s*[(\[]\s*/g, ' — ').replace(/\s*[)\]]\s*/g, ' — ').replace(/(\s—)+/g, ' —').replace(/^\s*—\s*|\s*—\s*$/g, '').trim();
async function svRef(v){
  if (!sv.refs.has(v.ref_audio)) sv.refs.set(v.ref_audio, fetch(new URL(v.ref_audio, TTS_SERVER.voices)).then(r => {
    if (!r.ok) throw new Error(`the voice clip ${v.ref_audio} answered ${r.status}`);
    return r.blob();
  }));
  return sv.refs.get(v.ref_audio).catch(e => { sv.refs.delete(v.ref_audio); throw e; });
}
function svGenerate(text){
  const run = async () => {
    const v = svVoice();
    const form = new FormData();
    form.append('text', svText(text));
    if (v.ref_audio) { form.append('ref_audio', await svRef(v), v.ref_audio.split('/').pop()); form.append('ref_text', v.ref_text); }
    if (v.instruction) form.append('instruction', v.instruction);
    form.append('cfg_scale', String(v.cfg_scale ?? 1));
    form.append('seed', String(v.seed ?? 42));
    for (let attempt = 0; ; attempt++) {
      const t0 = performance.now();
      const r = await fetch(TTS_SERVER.api + 'v1/audio/speech', { method: 'POST', body: form });
      if (r.status === 409 && attempt < 40) { await new Promise(res => setTimeout(res, 1500)); continue; }   // busy with another request
      if (!r.ok) {
        let detail = ''; try { detail = (await r.json()).detail; } catch {}
        throw new Error(`the voice server answered ${r.status}${detail ? ': ' + detail : ''}`);
      }
      const rate = Number(r.headers.get('X-Sample-Rate')) || 24000;
      const bytes = await r.arrayBuffer();
      // The audio streams without a length, so a server error partway through can look like a short,
      // complete answer. Speech is never faster than about 4 words a second: much less audio than the
      // text needs means the stream was cut off.
      const words = text.split(/\s+/).filter(Boolean).length;
      if (bytes.byteLength / 2 / rate < words * 0.12) throw new Error('the voice server stopped partway through');
      const pcm = new Int16Array(bytes, 0, bytes.byteLength >> 1), data = new Float32Array(pcm.length);
      for (let i = 0; i < pcm.length; i++) data[i] = pcm[i] / 32768;
      return { data, rate, genSec: (performance.now() - t0) / 1000 };
    }
  };
  const job = sv.queue.then(run, run);
  sv.queue = job.catch(() => {});
  return job;
}

/* ---------- natural voices: shared generation cache and playback ----------
   Each engine turns text into raw samples; this caches them as WAV clips, plays them through one
   <audio> element (pitch-preserving speed for Pocket TTS, instant pause/resume), prepares the next
   sentences ahead, and estimates the spoken word from playback position (neither engine reports
   word timings). */
const NEURAL = {
  kokoro: { name: 'Natural voice', st: k, ready: () => k.state === 'ready', load: () => kLoad(), size: () => FULL_PRECISION || k.gpu ? '~330 MB' : '~92 MB',
    generate: kGenerate, key: () => `kokoro|${k.voice}|${tts.rate}` },
  pocket: { name: 'Pocket TTS', st: pk, ready: pkReady, load: () => pkLoad(), size: () => `~${pocketMB()} MB`, playbackSpeed: true,
    generate: pkGenerate, key: () => `pocket|${pk.lang}|${pkVoice()}` },
  server: { name: 'Server voice', st: sv, ready: () => sv.state === 'ready' && sv.voices.length > 0, load: () => svLoad(), auto: true, playbackSpeed: true,
    generate: svGenerate, key: () => `server|${svVoice()?.id}` }
};
function neuralEngine(){
  if (tts.engine === 'kokoro' && kokoroFits()) return NEURAL.kokoro;
  if (tts.engine === 'pocket' && pocketLang()) return NEURAL.pocket;
  if (tts.engine === 'server' && sv.available && serverFits()) return NEURAL.server;
  return null;
}
// After an engine finishes loading: update the bar and start reading if the reader was waiting.
function nLoaded(st){
  ttsUpdateBar();
  const ne = neuralEngine();
  if (ne?.st === st && ne.ready() && st.wantPlay && tts.open) { st.wantPlay = false; tts.playing = true; ttsGo(tts.ci, tts.pos); }
}
const nAudio = new Audio();
nAudio.preservesPitch = true;
const n = { cache: new Map(), failed: new Set(), active: false, paused: false, token: 0, raf: 0 };
function wavUrl(data, rate){
  const buf = new ArrayBuffer(44 + data.length * 2), v = new DataView(buf);
  const str = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + data.length * 2, true); str(8, 'WAVEfmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
  v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, 'data'); v.setUint32(40, data.length * 2, true);
  for (let i = 0; i < data.length; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, data[i])) * 0x7fff, true);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
function nSynth(ne, text){
  const key = `${ne.key()}|${text}`;
  if (n.cache.has(key)) { const v = n.cache.get(key); n.cache.delete(key); n.cache.set(key, v); return v; }
  const job = ne.generate(text).then(r => {
    const dur = r.data.length / r.rate;
    kSpeedCheck(r.genSec / dur, ne);
    return { url: wavUrl(r.data, r.rate), dur };
  });
  job.catch(() => { n.cache.delete(key); n.failed.add(key); });   // don't ask for a failed passage again
  n.cache.set(key, job);
  while (n.cache.size > 40) {
    const [oldKey, old] = n.cache.entries().next().value;
    n.cache.delete(oldKey); old.then(c => URL.revokeObjectURL(c.url), () => {});
  }
  return job;
}
// Natural voices read whole paragraphs where possible (better phrasing than sentence by sentence):
// a span runs from (ci, pos) through the following sentences of the same block, up to a length the
// model handles in one go. Sentences stay the unit for highlighting, skipping and resuming.
const SPAN_MAX = { kokoro: 350, pocket: 600, server: 600 };
function nSpan(ne, ci, pos, single = false){
  const chunks = ttsChunks(), c = chunks[ci], max = ne === NEURAL.kokoro ? SPAN_MAX.kokoro : ne === NEURAL.pocket ? SPAN_MAX.pocket : SPAN_MAX.server;
  let cj = ci;
  while (!single && chunks[cj + 1] && chunks[cj + 1].b === c.b && chunks[cj + 1].e - pos <= max) cj++;
  return { ci, cj, pos, b: c.b, e: chunks[cj].e, ...speakable(c.b.text.slice(pos, chunks[cj].e)) };
}
async function nSpeak(c, ci, pos, token, single = false){
  const ne = neuralEngine();
  let span = nSpan(ne, ci, pos, single);
  if (span.cj > span.ci && n.failed.has(`${ne.key()}|${span.out}`)) span = nSpan(ne, ci, pos, true);   // failed before: sentence by sentence
  const slow = setTimeout(() => { if (token === tts.token) ttsUpdateBar('Preparing voice…'); }, 300);
  let clip;
  try { clip = await nSynth(ne, span.out); }
  catch (e) {
    if (token !== tts.token) return;
    // A paragraph can fail where a sentence would not (for example a prompt longer than the server
    // prepared for): retry this paragraph one sentence at a time before giving up.
    if (span.cj > span.ci) { clearTimeout(slow); return nSpeak(c, ci, pos, token, true); }
    tts.playing = false; ttsUpdateBar(); showNotice(`${ne.name} couldn't read this passage: ${e.message}`, 'error');
    return;
  } finally { clearTimeout(slow); }
  if (token !== tts.token || !tts.playing) return;
  ttsUpdateBar();
  // Prepare the next two spans while this one plays.
  const chunks = ttsChunks();
  let next = span.cj + 1;
  for (let i = 0; i < 2 && chunks[next]; i++) {
    let nx = nSpan(ne, next, chunks[next].s);
    if (nx.cj > nx.ci && n.failed.has(`${ne.key()}|${nx.out}`)) nx = nSpan(ne, next, chunks[next].s, true);
    nSynth(ne, nx.out).catch(() => {}); next = nx.cj + 1;
  }
  Object.assign(n, { active: true, paused: false, token, span, dur: clip.dur });
  nAudio.onended = () => { n.active = false; if (token === tts.token && tts.playing) ttsGo(span.cj + 1, null, { keepFollow: true }); };
  nAudio.src = clip.url;
  nAudio.playbackRate = ne.playbackSpeed ? tts.rate : 1;
  try { await nAudio.play(); }
  catch (e) {
    if (token === tts.token) { tts.playing = false; n.active = false; ttsUpdateBar(); showNotice(`The voice couldn't play: ${e.message}`, 'error'); }
    return;

// Estimate the spoken position from playback time. Characters are weighted, with extra weight after
// punctuation where speakers pause, and the estimate moves both the sentence and the word highlight.
function nLoop(token){
  cancelAnimationFrame(n.raf);
  const { span } = n, text = span.out, chunks = ttsChunks();
  const cum = new Float32Array(text.length + 1);
  for (let i = 0; i < text.length; i++) cum[i + 1] = cum[i] + 1 + (/[.!?…]/.test(text[i]) ? 10 : /[,;:—–]/.test(text[i]) ? 4 : 0);
  const words = [...text.matchAll(/[\p{L}\p{N}'’\-]+/gu)];
  let lastWord = -1, lastSentence = -1;
  const step = () => {
    if (token !== tts.token || !tts.playing || !n.active) return;
    const dur = isFinite(nAudio.duration) ? nAudio.duration : n.dur;
    const target = Math.min(1, nAudio.currentTime / dur) * cum[text.length];
    let lo = 0, hi = text.length;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (cum[mid + 1] <= target) lo = mid + 1; else hi = mid; }
    let w = words.findIndex(m => m.index + m[0].length > lo); if (w < 0) w = words.length - 1;
    if (w !== lastWord && words[w]) {
      lastWord = w;
      const m = words[w], a = span.pos + span.map[m.index], z = span.pos + span.map[m.index + m[0].length - 1] + 1;
      let si = span.ci; while (si < span.cj && a >= chunks[si].e) si++;
      tts.pos = a; tts.ci = si;
      if (si !== lastSentence) { lastSentence = si; hl('tts-sentence', rangeFor(span.b, Math.max(span.pos, chunks[si].s), chunks[si].e)); }
      const r = rangeFor(span.b, a, z);
      hl('tts-word', r); follow(r);
    }

  };
  step();
}
function nStop(){
  cancelAnimationFrame(n.raf);
  nAudio.onended = null; nAudio.pause();
  n.active = false; n.paused = false;
}

/* ---------- start ---------- */
$('#fontPct').textContent = fontPct + '%';
setLine(lineH);
{ const t = store.get('spine:theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); }
syncThemeBtn();
setToc(!narrow.matches);
if (!window.JSZip) {
  $('#bookTitle').textContent = 'Spine Reader';
  showNotice("The ZIP library didn't load, so EPUB files can't be opened. Check your connection and reload the page.", 'error');
} else {
  const ref = new URLSearchParams(location.search).get('book');
  (ref ? openFromUrl(ref) : openSample());
}
async function openSample(){
  try { await openBook(zipSource(await JSZip.loadAsync(await makeSample())), { sample: true }); }
  catch (err) { hideStatus(); showNotice("Couldn't build the sample book: " + err.message, 'error'); }
}
/* ?book=dir/ opens an extracted EPUB folder; ?book=dir/a.epub fetches and unzips the archive.
   A relative path is tried first relative to this page, then under BOOKSHELF at the site root
   (?book=books/x/ -> books/x/, then /bookshelf/books/x/). Only books on this same site are accepted. */
function bookCandidates(ref){
  const urls = [new URL(ref, location.href)];
  if (!ref.startsWith('/') && !isExternal(ref)) urls.push(new URL(BOOKSHELF + ref.replace(/^(\.\/)+/, ''), location.origin));
  for (const u of urls) { u.search = ''; u.hash = ''; }
  return urls.filter((u, i) => urls.findIndex(v => v.href === u.href) === i);
}
async function openFromUrl(ref){
  showStatus(`Loading ${ref}…`);
  const name = decodeURIComponent(ref.replace(/\/+$/, '').split('/').pop() || ref).replace(/\.epub$/i, '');
  try {
    const candidates = bookCandidates(ref);
    if (candidates.some(u => u.origin !== location.origin)) throw new Error('Only books hosted on this same site can be opened from the address.');
    const misses = [];
    for (const u of candidates) {
      if (/\.epub$/i.test(u.pathname)) {
        let r = null;
        try { r = await fetch(u.href); } catch {}
        if (!r?.ok) { misses.push(`${u.pathname} (${r ? r.status : 'network error'})`); continue; }
        await openBook(zipSource(await JSZip.loadAsync(await r.arrayBuffer())), { name });
        return;
      }
      if (!u.pathname.endsWith('/')) u.pathname += '/';
      const src = dirSource(u.href);
      if (!(await src.text('META-INF/container.xml'))) { misses.push(`${u.pathname} (no META-INF/container.xml)`); continue; }
      await openBook(src, { name });
      return;
    }
    throw new Error(`Nothing was found at ${misses.join(' or ')}.`);
  } catch (err) {
    await openSample();
    showNotice(friendly(err, ref), 'error');
  }
}
})();
