<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spine Reader</title>
<!-- The interface fonts: fonts/ui.css when self-hosted (fetch-fonts.sh), otherwise Google Fonts; set at start-up. -->
<link id="uiFonts" rel="stylesheet" href="data:text/css,">
<style>
/* Layout: one-screen reading app. Top bar, contents rail on the left, the page as the one framed object, a segmented spine ribbon along the bottom. */
:root{
  --paper:#EEF0EC; --surface:#F7F8F5; --ink:#1C2120; --muted:#5C6661; --rule:#D3D8D2;
  --ribbon:#8B2A3B; --on-ribbon:#FFFFFF; --ribbon-soft:#F0DCDF; --warn-soft:#F7E6CF;
  --page-bg:#FDFDFB; --page-ink:#1C2120;
  --shadow:0 1px 2px rgb(20 30 25 / .05), 0 10px 30px -14px rgb(20 30 25 / .22);
  --font-read:"Literata", Georgia, "Times New Roman", serif;
  --font-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121514; --surface:#1A1E1C; --ink:#DCE2DE; --muted:#939D97; --rule:#2C3330;
    --ribbon:#E27D8E; --on-ribbon:#1E0E12; --ribbon-soft:#3A2228; --warn-soft:#3B2C17;
    --page-bg:#171A19; --page-ink:#D6DCD8;
    --shadow:0 1px 2px rgb(0 0 0 / .4), 0 12px 30px -14px rgb(0 0 0 / .7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121514; --surface:#1A1E1C; --ink:#DCE2DE; --muted:#939D97; --rule:#2C3330;
  --ribbon:#E27D8E; --on-ribbon:#1E0E12; --ribbon-soft:#3A2228; --warn-soft:#3B2C17;
  --page-bg:#171A19; --page-ink:#D6DCD8;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 12px 30px -14px rgb(0 0 0 / .7);
  color-scheme:dark;
}

[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.45 var(--font-ui);overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--rule)}
.book-id{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
#bookTitle{font:italic 400 1.2rem/1.2 var(--font-read);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bookAuthor{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:8px}
.size{display:flex;align-items:center;gap:2px}
#widthVal{min-width:6ch}
#fontPct,.readout{font:500 12px/1 var(--font-mono);color:var(--muted);min-width:4ch;text-align:center;font-variant-numeric:tabular-nums}
.btn{font:500 13px/1 var(--font-ui);color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:6px;
  height:34px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.ribbon:focus-visible,#tocList a:focus-visible{outline:2px solid var(--ribbon);outline-offset:2px}
.btn.ghost{border-color:transparent;padding:0 9px}
.btn.ghost:hover:not(:disabled){border-color:var(--rule)}
.btn.primary{background:var(--ribbon);border-color:var(--ribbon);color:var(--on-ribbon)}
.btn.primary:hover{filter:brightness(1.08)}
.btn svg{width:16px;height:16px;flex:none}
#fileInput{display:none}

/* body */
.main{flex:1;min-height:0;display:flex;gap:20px;position:relative;padding-block:16px}
.toc{width:280px;flex:none;overflow:auto;display:flex;flex-direction:column;gap:24px;padding-right:4px}
.toc.collapsed{display:none}
.meta-title{font:600 1.3rem/1.25 var(--font-read);margin:0;text-wrap:balance}
.meta-authors{color:var(--muted);margin:4px 0 0}
.label{font:500 11px/1 var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
#tocList ol{list-style:none;margin:0;padding:0}
#tocList ol ol{padding-left:10px;margin-left:9px;border-left:1px solid var(--rule)}
#tocList a,#tocList span{display:block;padding:6px 9px;border-radius:5px;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35}
#tocList a:hover{background:var(--surface)}
#tocList a[aria-current]{background:var(--ribbon-soft);color:var(--ribbon);font-weight:500}
#tocList span{color:var(--muted)}
.search{position:relative;margin-bottom:-12px}
.search svg{position:absolute;left:9px;top:50%;width:14px;height:14px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
#searchBox{width:100%;box-sizing:border-box;height:32px;padding:0 9px 0 29px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px}
#searchBox:focus{outline:2px solid var(--ribbon);outline-offset:-1px}
.search-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.search-head .label{margin:0}
.search-nav{display:flex;gap:2px}
.search-nav .btn{height:26px;padding:0 6px}
#searchResults h3{font:500 11px/1.3 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
#searchResults button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;font-size:13px;line-height:1.4;padding:6px 9px;border-radius:5px;cursor:pointer}
#searchResults button:hover{background:var(--surface)}
#searchResults button[aria-current]{background:var(--ribbon-soft)}
#searchResults button:focus-visible{outline:2px solid var(--ribbon);outline-offset:1px}
#searchResults mark{background:none;color:var(--ribbon);font-weight:600}
#searchResults .more{color:var(--muted);font-size:12.5px;margin:12px 9px 0}
.desc{margin-top:12px;font-size:13px}
.desc summary{cursor:pointer;color:var(--muted);font:500 11px/1 var(--font-mono);letter-spacing:.09em;text-transform:uppercase;padding:4px 0;width:max-content}
.desc summary:hover{color:var(--ink)}
.desc summary:focus-visible{outline:2px solid var(--ribbon);outline-offset:2px}
#metaDescBody{display:flex;flex-direction:column;gap:8px;margin-top:8px;font-family:var(--font-read);font-size:13.5px;line-height:1.55;max-height:40vh;overflow:auto}
#metaDescBody p{margin:0}
.pkg{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font:12px/1.4 var(--font-mono);margin:0}
.pkg dt{color:var(--muted)}
.pkg dd{margin:0;overflow-wrap:anywhere;min-width:0}

.reader{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;position:relative}
#page{flex:1;min-height:0;width:100%;border:1px solid var(--rule);border-radius:4px;background:var(--page-bg);box-shadow:var(--shadow);display:block}
.notice{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:9px 10px 9px 14px;border-radius:6px;background:var(--ribbon-soft);font-size:13px}
.notice.error{background:var(--warn-soft)}
.notice p{margin:0;flex:1;min-width:14em}
.notice .btn{height:30px}
.status{position:absolute;inset:0;display:grid;place-items:center;font:500 13px/1.4 var(--font-mono);color:var(--muted);
  background:color-mix(in srgb,var(--paper) 75%,transparent);border-radius:4px;text-align:center;padding:16px}

/* footer */
.foot{display:flex;align-items:center;gap:14px;padding-block:10px 12px;border-top:1px solid var(--rule)}
.where{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.loc{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.loc .mono{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chapLabel{font-family:var(--font-read);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mono{font:12px/1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.ribbon{--n:1;position:relative;height:7px;border-radius:2px;background:var(--rule);overflow:hidden;cursor:pointer}
.ribbon::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100% / var(--n) - 2px),var(--paper) calc(100% / var(--n) - 2px),var(--paper) calc(100% / var(--n)))}
.ribbon.dense::after{display:none}
#ribbonFill{height:100%;width:0;background:var(--ribbon);transition:width .2s ease-out}

.drop{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:color-mix(in srgb,var(--paper) 88%,transparent)}
.drop div{pointer-events:none;border:2px dashed var(--ribbon);border-radius:10px;padding:40px 48px;font:italic 1.4rem var(--font-read);color:var(--ribbon);text-align:center}

/* full-screen reading: only the page remains */
.app.fs{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.app.fs .bar,.app.fs .foot,.app.fs .toc,.app.fs .notice{display:none !important}
.app.fs .main{padding-block:0;gap:0}
.app.fs #page{border:0;border-radius:0;box-shadow:none}
.fs-pill{position:fixed;z-index:15;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px;padding:5px 5px 5px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--rule);
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s}
.app:not(.fs) .fs-pill{display:none}
.app.fs.awake .fs-pill,.fs-pill:focus-within{opacity:1;pointer-events:auto}
.fs-pill .btn{height:30px}
kbd{font:500 11px/1 var(--font-mono);border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:2px 5px;color:var(--muted)}

/* layout button shows the current layout */
#layoutBtn svg{display:none}
#layoutBtn[data-layout="two"] .i-two,#layoutBtn[data-layout="one"] .i-one,#layoutBtn[data-layout="scroll"] .i-scroll{display:block}

/* theme toggle shows the icon of the mode it switches to */
#themeBtn .i-sun{display:none}
#themeBtn.dark .i-sun{display:block}
#themeBtn.dark .i-moon{display:none}

/* read-aloud bar, floating over the bottom margin of the page */
.tts{position:absolute;z-index:6;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;
  width:max-content;max-width:calc(100% - 24px);box-sizing:border-box;padding:6px 8px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow)}
.tts .btn{height:32px}
.tts .btn.primary{width:40px;justify-content:center;padding:0}
.tts-speed{display:flex;align-items:center;gap:6px;padding:0 4px}
.tts-speed input{width:96px;accent-color:var(--ribbon)}
#ttsRateVal{min-width:3.5ch}
#ttsSleep{max-width:170px}
@media (max-width:640px){#timeLeft .book,#timeLeft .ctx,#spinePos .spine-n,.loc .pct-part{display:none}}
#ttsVoice,#ttsEngine,#ttsSleep{height:32px;max-width:190px;font:400 13px var(--font-ui);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:0 6px}
#ttsVoice:focus-visible,#ttsEngine:focus-visible,#ttsSleep:focus-visible,.tts-speed input:focus-visible{outline:2px solid var(--ribbon);outline-offset:2px}
#ttsStatus{font:12px/1.3 var(--font-mono);color:var(--muted);padding:0 4px}
#ttsPlay .i-pause,#ttsPlay.playing .i-play{display:none}
#ttsPlay.playing .i-pause{display:block}
#ttsBtn[aria-pressed="true"]{border-color:var(--ribbon);color:var(--ribbon)}

/* font picker */
.font-pick{position:relative}
#fontBtn .aa{font-size:16px;line-height:1;font-weight:500}
#fontBtn svg{width:10px;height:10px}
.menu{position:absolute;z-index:30;right:0;top:calc(100% + 6px);width:270px;max-width:calc(100vw - 32px);box-sizing:border-box;
  display:flex;flex-direction:column;gap:2px;padding:8px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadow)}
.menu .label{margin:4px 8px 8px}
.opt{display:flex;align-items:baseline;justify-content:space-between;gap:12px;width:100%;padding:8px 10px;border:0;border-radius:5px;
  background:transparent;color:var(--ink);cursor:pointer;text-align:left;font-size:17px;line-height:1.25}
.opt:hover,.opt:focus-visible{background:var(--paper);outline:none}
.opt small{font:400 11px/1.2 var(--font-mono);color:var(--muted);white-space:nowrap}
.opt[aria-checked="true"]{color:var(--ribbon)}
.opt[aria-checked="true"] small::before{content:"✓ ";color:var(--ribbon)}

@media (max-width:820px){
  .hide-sm{display:none}
  .toc,.toc.collapsed{display:flex;position:absolute;z-index:5;top:0;bottom:0;left:0;width:min(320px,88%);box-sizing:border-box;
    background:var(--surface);padding:18px 16px;border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);
    transform:translateX(calc(-100% - 24px));visibility:hidden;transition:transform .2s ease-out,visibility 0s .2s}
  .toc.open{transform:none;visibility:visible;transition:transform .2s ease-out}
  .bar{gap:6px}
  .tools{gap:2px}
  .btn.ghost{padding:0 7px}
  .menu{position:fixed;top:auto;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
    bottom:calc(16px + env(safe-area-inset-bottom,0px));width:auto;max-width:none}
}
@media (max-width:520px){
  .bar{flex-wrap:wrap;row-gap:8px}
  .book-id{flex-basis:calc(100% - 60px)}
  .tools{width:100%;justify-content:space-between}
  .tools .btn.ghost{padding:0 4px}
  .tools .btn.primary{padding:0 10px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <button class="btn ghost" id="tocBtn" aria-controls="toc" aria-expanded="true" title="Show or hide contents (C); I shows the book information">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h8"/></svg>
      <span class="hide-sm">Contents</span>
    </button>
    <div class="book-id"><span id="bookTitle">Loading…</span><span id="bookAuthor"></span></div>
    <div class="tools">
      <button class="btn ghost" id="ttsBtn" aria-pressed="false" title="Read aloud (R starts at your selection or the top of the page)" aria-label="Read aloud">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 6v4h2.5l3.5 3V3L5 6H2.5Z"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.5a6.2 6.2 0 0 1 0 9"/></svg>
      </button>
      <div class="font-pick">
        <button class="btn ghost" id="fontBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="fontMenu" title="Reading font">
          <span class="aa">Aa</span>
          <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m2 3.5 3 3 3-3"/></svg>
        </button>
        <div class="menu" id="fontMenu" role="menu" aria-label="Reading font" hidden>
          <p class="label">Reading font</p>
        </div>
      </div>
      <button class="btn ghost" id="themeBtn" title="Switch to dark mode" aria-label="Switch to dark mode">
        <svg class="i-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M13.5 9.6A5.75 5.75 0 0 1 6.4 2.5a5.75 5.75 0 1 0 7.1 7.1Z"/></svg>
        <svg class="i-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="2.75"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.06 1.06M11.54 11.54l1.06 1.06M3.4 12.6l1.06-1.06M11.54 4.46l1.06-1.06"/></svg>
      </button>
      <button class="btn ghost" id="layoutBtn" title="Layout (L)" aria-label="Layout">
        <svg class="i-two" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="1"/><path d="M8 2.75v10.5M3.75 5.5h2.5M3.75 8h2.5M9.75 5.5h2.5M9.75 8h2.5"/></svg>
        <svg class="i-one" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3.25" y="2.75" width="9.5" height="10.5" rx="1"/><path d="M5.5 5.5h5M5.5 8h5M5.5 10.5h3"/></svg>
        <svg class="i-scroll" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 1.75v12.5M7 4.5h5M7 7.5h5M7 10.5h3"/><path d="m2.5 11.75 1.5 2.5 1.5-2.5"/></svg>
      </button>
      <button class="btn ghost" id="fsBtn" title="Full screen (F)" aria-label="Full screen">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
      </button>
      <div class="size" role="group" aria-label="Text size">
        <button class="btn ghost" id="smaller" title="Smaller text" aria-label="Smaller text">A−</button>
        <span id="fontPct" class="hide-sm" aria-live="polite">100%</span>
        <button class="btn ghost" id="larger" title="Larger text" aria-label="Larger text">A+</button>
      </div>
      <div class="size" role="group" aria-label="Line spacing">
        <button class="btn ghost" id="tighter" title="Less space between lines" aria-label="Less space between lines">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 5.5h12M2 8h12M2 10.5h12"/></svg>
        </button>
        <span id="lineVal" class="readout hide-sm" aria-live="polite">1.65</span>
        <button class="btn ghost" id="looser" title="More space between lines" aria-label="More space between lines">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 2.5h12M2 8h12M2 13.5h12"/></svg>
        </button>
      </div>
      <div class="size hide-sm" role="group" aria-label="Text width">
        <button class="btn ghost" id="narrower" title="Narrower text" aria-label="Narrower text">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M1.5 8h4.5M4 5.5 6.5 8 4 10.5M14.5 8H10M12 5.5 9.5 8l2.5 2.5"/></svg>
        </button>
        <span id="widthVal" class="readout" aria-live="polite">Medium</span>
        <button class="btn ghost" id="wider" title="Wider text" aria-label="Wider text">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 8H1.5M3.5 5.5 1 8l2.5 2.5M10 8h4.5M12.5 5.5 15 8l-2.5 2.5"/></svg>
        </button>
      </div>
      <label class="btn ghost" for="fileInput" tabindex="0" role="button" id="openBtn" title="Open a book (EPUB, comic, text, Markdown or HTML)" aria-label="Open a book">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M1.75 12.5V3.25h4l1.5 1.5h5.5v1.75"/><path d="M1.75 12.5 3.5 6.5h11l-1.75 6H1.75Z"/></svg>
      </label>
      <input type="file" id="fileInput" accept=".epub,application/epub+zip,.cbz,application/vnd.comicbook+zip,.txt,.text,text/plain,.md,.markdown,.mdown,.mkd,text/markdown,.html,.htm,.xhtml,text/html">
    </div>
  </header>

  <div class="main">
    <aside class="toc" id="toc" aria-label="Book contents">
      <div>
        <h1 class="meta-title" id="metaTitle"></h1>
        <p class="meta-authors" id="metaAuthors"></p>
        <details class="desc" id="metaDesc" hidden>
          <summary>Description</summary>
          <div id="metaDescBody"></div>
        </details>
      </div>
      <div class="search" role="search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></svg>
        <input type="search" id="searchBox" placeholder="Search in book" aria-label="Search in book" title="Search in book (/ or Ctrl+F); Enter for the next match" autocomplete="off" spellcheck="false">
      </div>
      <section id="searchPanel" aria-label="Search results" hidden>
        <div class="search-head"><p class="label" id="searchStatus" aria-live="polite"></p>
          <div class="search-nav">
            <button class="btn ghost" id="searchPrev" title="Previous match (Shift+Enter)" aria-label="Previous match"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 10 4-4 4 4"/></svg></button>
            <button class="btn ghost" id="searchNext" title="Next match (Enter)" aria-label="Next match"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
          </div>
        </div>
        <div id="searchResults"></div>
      </section>

  // Only marked links do anything: in-book links go through goTo, web links open in a new tab. Anything else
  // (a link without a usable target) mustn't navigate the page frame away from the book.
  if (link && !link.hasAttribute('data-spine-path') && link.getAttribute('target') !== '_blank') e.preventDefault();
  const a = link?.hasAttribute('data-spine-path') ? link : null;
  if (!a) { ttsClickStart(e); return; }
  e.preventDefault();
  goTo(a.getAttribute('data-spine-path'), a.getAttribute('data-spine-frag'));
}
function goTo(path, frag = ''){
  const idx = book.spine.findIndex(s => s.path === path);
  if (idx < 0) { showNotice(`That link points to ${path}, which isn't part of the book's reading order.`, 'error'); return; }
  if (idx === cur.i && cur.shown && frame.contentDocument) { position(frag, 0); return; }
  renderChapter(idx, { frag });   // (also a chapter that failed to load: choosing it again tries again)
}
function restyleFrame(){
  const doc = frame.contentDocument; if (!doc) return;
  const b = doc.getElementById('spine-base'), o = doc.getElementById('spine-override');
  if (b) b.textContent = baseCss();
  if (o) o.textContent = overrideCss();
  const l = doc.getElementById('spine-font'), h = fontHref();
  if (l && l.getAttribute('href') !== h) {
    l.addEventListener('load', () => (doc.fonts?.ready || Promise.resolve()).then(relayout), { once: true });
    l.setAttribute('href', h);
  }
  relayout();
}

// Scroll layout: how far the text area reaches (the read-aloud bar covers the bottom of the frame).
const viewBottom = () => frame.contentWindow.innerHeight - (tts.open ? tts.barH : 0) - 16;
const atTop = () => (scroller()?.scrollTop ?? 0) <= 4;
const atBottom = () => { const se = scroller(); return !se || se.scrollTop + se.clientHeight >= se.scrollHeight - 4; };
function pageNext(){
  if (!book) return;
  ttsUserNav();
  if (scrolling()) {
    if (!atBottom()) { const se = scroller(); scrollTo(se.scrollTop + viewBottom() - 60); }
    else if (cur.i < book.spine.length - 1) renderChapter(cur.i + 1);
    return;
  }
  if (cur.page < cur.pages - 1) showPage(cur.page + 1);
  else if (cur.i < book.spine.length - 1) renderChapter(cur.i + 1);
}
function pagePrev(){
  if (!book) return;
  ttsUserNav();
  if (scrolling()) {
    if (!atTop()) { const se = scroller(); scrollTo(se.scrollTop - (viewBottom() - 60)); }
    else if (cur.i > 0) renderChapter(cur.i - 1, { fraction: 1 });
    return;
  }
  if (cur.page > 0) showPage(cur.page - 1);
  else if (cur.i > 0) renderChapter(cur.i - 1, { fraction: 1 });
}
function onKey(e){
  const tag = (e.target.tagName || '').toLowerCase();
  if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && (e.key === 'f' || e.key === 'F') && book && e.target.id !== 'searchBox') { e.preventDefault(); searchOpen(); return; }
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (e.key === '/') { e.preventDefault(); searchOpen(); return; }
  if (menuOpen() && menuKey(e)) return;
  if (e.key === ' ' && tts.open && tag !== 'button' && tag !== 'a') { e.preventDefault(); ttsTogglePlay(); return; }
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); ttsReadHere(); return; }
  if (e.key === '[' || e.key === ']') { if (tts.open) { e.preventDefault(); ttsSetRate(tts.rate + (e.key === ']' ? 0.1 : -0.1)); } return; }
  if (e.key === 'Escape' && isFs()) { e.preventDefault(); setFs(false); }
  else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); setFs(!isFs()); }
  else if (e.key === 't' || e.key === 'T') { e.preventDefault(); setTheme(isDark() ? 'light' : 'dark'); }
  else if ((e.key === 'c' || e.key === 'C') && !isFs()) { e.preventDefault(); setToc(!tocIsOpen()); }
  else if ((e.key === 'i' || e.key === 'I') && !isFs()) { e.preventDefault(); toggleInfo(); }
  else if (e.key === 'l' || e.key === 'L') { e.preventDefault(); setLayout({ two: 'one', one: 'scroll', scroll: 'two' }[layout]); }
  else if (scrolling() && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {   // scroll a little, like a normal page
    e.preventDefault(); ttsUserNav(); const se = scroller(); if (se) scrollTo(se.scrollTop + (e.key === 'ArrowDown' ? 60 : -60));
  }
  else if (['ArrowRight', 'ArrowDown', 'PageDown'].includes(e.key)) { e.preventDefault(); pageNext(); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); pagePrev(); }
}

/* ---------- chrome ---------- */
function renderMeta(){
  document.title = book.title;
  $('#metaTitle').textContent = book.title;
  $('#metaAuthors').textContent = book.authors.join(', ');
  const i = book.info;
  const paras = descriptionParagraphs(i.description);
  $('#metaDescBody').replaceChildren(...paras.map(t => { const p = document.createElement('p'); p.textContent = t; return p; }));
  $('#metaDesc').hidden = !paras.length;
  $('#metaDesc').open = false;
  const rows = [
    ['Publisher', i.publisher], ['Published', i.published], ['ISBN', i.isbn], ['Series', i.series],
    ['Subjects', i.subjects], ['Narrator', i.narrator], ['Narration', i.duration], ['Language', book.language], ['Layout', i.layout], ['Direction', i.direction],
    ...(book.format
      ? [['Format', book.format], ...(book.comic ? [['Pages', plural(book.pageCount, 'page')]] : []), ['Sections', plural(book.spine.length, 'section')], ['File', book.opfPath], ['Showing', '', 'curFile']]
      : [['EPUB', book.version], ['Spine', plural(book.spine.length, 'item')], ['Manifest', plural(book.manifest.size, 'item')],
         ['Package', book.opfPath], ['Showing', '', 'curFile'], ['ID', book.uid || 'none (the position is kept by the title and chapter files)']])
  ].filter(([, v, id]) => v || id);
  $('#infoList').replaceChildren(...rows.flatMap(([k, v, id]) => {
    const dt = document.createElement('dt'), dd = document.createElement('dd');
    dt.textContent = k; dd.textContent = v; if (id) dd.id = id;
    return [dt, dd];
  }));
  const r = $('#ribbon');
  r.style.setProperty('--n', book.spine.length);
  r.classList.toggle('dense', book.spine.length > 80);
}
function renderToc(){
  const build = list => {
    const ol = document.createElement('ol');
    for (const e of list) {
      const li = document.createElement('li');
      const el = document.createElement(e.path ? 'a' : 'span');
      el.textContent = e.label;
      if (e.path) { el.href = '#'; el.dataset.path = e.path; el.dataset.frag = e.frag; }
      li.append(el);
      if (e.children.length) li.append(build(e.children));
      ol.append(li);
    }
    return ol;
  };
  $('#tocList').replaceChildren(build(book.toc));
}
function tocLinkFor(path){
  const list = $('#tocList');
  const depth = a => { let d = 0; for (let p = a; p && p !== list; p = p.parentElement) if (p.tagName === 'OL') d++; return d; };
  const hits = [...list.querySelectorAll('a[data-path]')].filter(a => a.dataset.path === path);
  hits.sort((x, y) => (!!x.dataset.frag - !!y.dataset.frag) || (depth(y) - depth(x)));
  return hits[0] || null;
}
// When a file holds several contents entries (a Markdown document, an EPUB chapter file with sections),
// the entry for the section on screen: the last heading at or before the current page (scroll layout:
// above the upper third of the view). Null before the first heading, or while the page isn't laid out.
function sectionLink(){
  const doc = frame.contentDocument, path = book.spine[cur.i].path;
  if (!doc?.getElementById('spine-flow')) return null;
  const hits = [...$('#tocList').querySelectorAll('a[data-path]')].filter(a => a.dataset.path === path && a.dataset.frag);
  if (hits.length < 2) return null;
  let best = null, bestEl = null;
  for (const a of hits) {
    const el = doc.getElementById(a.dataset.frag);
    if (!el || (bestEl && !(bestEl.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING))) continue;
    let seen;
    if (scrolling()) seen = el.getBoundingClientRect().top <= frame.contentWindow.innerHeight / 3;
    else { const r = doc.createRange(); r.selectNode(el); seen = pageOfRange(r) <= cur.page; }
    if (seen) { best = a; bestEl = el; }
  }
  return best;
}
function updateSection(){
  let link = sectionLink();
  for (let j = cur.i; j >= 0 && !link; j--) link = tocLinkFor(book.spine[j].path);
  $('#chapLabel').textContent = link ? link.textContent : book.spine[cur.i].href.split('/').pop();
  const was = $('#tocList').querySelector('a[aria-current]');
  if (was === link) return;
  was?.removeAttribute('aria-current');
  if (link) { link.setAttribute('aria-current', 'true'); link.scrollIntoView({ block: 'nearest' }); }
}
function updateChrome(){
  $('#bookTitle').textContent = book.title;
  $('#bookAuthor').textContent = book.authors.join(', ');
  $('#curFile').textContent = book.spine[cur.i].path;
  updateProgress();
}
// "page 3/12 · spine 2/9": the spine part is hidden on narrow screens, where the time left matters more.
function setSpinePos(where, n){
  const sp = document.createElement('span'); sp.className = 'spine-n'; sp.textContent = ` · spine ${cur.i + 1}/${n}`;
  $('#spinePos').replaceChildren(where, sp);
}
function updateProgress(){
  if (!book) return;
  updateSection();
  turnedPage();
  updateTimeLeft();
  const overall = (cur.i + fraction()) / book.spine.length;
  const pct = Math.round(overall * 100);
  $('#ribbonFill').style.width = (overall * 100).toFixed(2) + '%';
  $('#ribbon').setAttribute('aria-valuenow', pct);
  $('#pct').textContent = pct + '%';
  const n = book.spine.length;
  if (scrolling()) {
    const within = Math.round(fraction() * 100);
    setSpinePos(`${within}% of section`, n);
    $('#fsPos').textContent = `${pct}%`;
    $('#prevBtn').disabled = cur.i === 0 && atTop();
    $('#nextBtn').disabled = cur.i === n - 1 && atBottom();
  } else {
    setSpinePos(`page ${cur.page + 1}/${cur.pages}`, n);
    $('#fsPos').textContent = `page ${cur.page + 1}/${cur.pages} · ${pct}%`;
    $('#prevBtn').disabled = cur.i === 0 && cur.page === 0;
    $('#nextBtn').disabled = cur.i === n - 1 && cur.page >= cur.pages - 1;
  }
}
function showStatus(msg){ const s = $('#status'); s.textContent = msg; s.hidden = false; }
function hideStatus(){ $('#status').hidden = true; }
let noticeKind = '';
function showNotice(msg, kind){
  noticeKind = kind;
  $('#notice').className = 'notice' + (kind === 'error' ? ' error' : '');
  $('#noticeText').textContent = msg;
  $('#noticeAction').textContent = kind === 'error' ? 'Dismiss' : 'Open a book';
  $('#notice').hidden = false;
}
function hideNotice(){ $('#notice').hidden = true; }
function friendly(err, name){
  const m = String(err?.message || err);
  if (/central directory|zip/i.test(m) && !/EPUB|^Nothing was found/.test(m)) return `${name} couldn't be read as a ZIP archive. EPUB files are ZIP archives, so this probably isn't an EPUB.`;
  return `${name} couldn't be opened. ${m}`;
}

async function openFile(file){
  if (!file) return;
  try {
    const kind = docKind(file.name, file.type);
    if (kind) await openDocument(await file.arrayBuffer(), file.name, kind, { key: `spine:pos:${kind}:${file.name}:${file.size}` });
    else {
      const zip = await zipFromBlob(file).catch(() => null) || await JSZip.loadAsync(await file.arrayBuffer());   // in place when possible
      await openZip(zip, file.name, { key: `spine:pos:cbz:${file.name}:${file.size}` });
    }
  }
  catch (err) { hideStatus(); showNotice(friendly(err, file.name), 'error'); }
}

// Cycle the layout, keeping the reader's place (as a fraction of the section) across the change.
function setLayout(next, save = true){
  if (book && frame.contentDocument) cur.f = fraction();
  layout = next;
  if (save) store.set('spine:layout', layout);
  const b = $('#layoutBtn');
  b.dataset.layout = layout;
  const following = { two: 'one', one: 'scroll', scroll: 'two' }[layout];
  b.title = `Layout: ${LAYOUTS[layout]} (L switches to ${LAYOUTS[following].toLowerCase()})`;
  b.setAttribute('aria-label', `Layout: ${LAYOUTS[layout]}`);
  restyleFrame();
  updateProgress();
}
$('#layoutBtn').addEventListener('click', () => setLayout({ two: 'one', one: 'scroll', scroll: 'two' }[layout]));
function setWidth(step, save = true){
  widthStep = Math.max(0, Math.min(WIDTHS.length - 1, step));
  $('#widthVal').textContent = WIDTHS[widthStep][0];
  $('#narrower').disabled = widthStep === 0;

  if (save) store.set('spine:width', widthStep);
  restyleFrame();
}
$('#narrower').addEventListener('click', () => setWidth(widthStep - 1));
$('#wider').addEventListener('click', () => setWidth(widthStep + 1));
function setFont(p){

function setLine(v, save = true){

/* Font picker */
let fontFace = FONTS.some(f => f.id === store.get('spine:face')) ? store.get('spine:face') : 'book';
const face = () => FONTS.find(f => f.id === fontFace) || FONTS[0];
const faceStack = () => face().stack;
/* Fonts: fonts/<id>.css under LIB_FILES when self-hosted (fetch-fonts.sh writes ui.css plus one file per
   reading font), otherwise Google Fonts (unless ALLOW_CDN is off: then the device's fonts). */
let fontsLocal = false;
const fontsBase = () => new URL('fonts/', folderBase(LIB_FILES)).href;
const NO_CSS = 'data:text/css,';
function fontCss(f){
  const id = f.css ? f.id : 'literata';   // the book's own font falls back to Literata
  if (fontsLocal) return fontsBase() + id + '.css';
  if (!ALLOW_CDN) return NO_CSS;
  return f.css ? GF(f.css) : FONT_URL;
}
const fontHref = () => fontCss(face());
const UI_FONTS = 'https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap';
async function setupFonts(){
  fontsLocal = await realFile(fontsBase() + 'ui.css');
  $('#uiFonts').href = fontsLocal ? fontsBase() + 'ui.css' : ALLOW_CDN ? UI_FONTS : NO_CSS;
}
const menuOpen = () => !$('#fontMenu').hidden;
let previewsLoaded = false;
function loadPreviews(){
  if (previewsLoaded) return; previewsLoaded = true;
  const add = href => { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href; document.head.append(l); };
  if (fontsLocal) { for (const f of FONTS.filter(f => f.css)) add(fontCss(f)); return; }
  if (!ALLOW_CDN) return;
  const fams = FONTS.filter(f => f.css).map(f => 'family=' + f.css.split(':')[0]).join('&');
  const chars = [...new Set(FONTS.map(f => f.name).join('') + 'Aa')].join('');
  add(`https://fonts.googleapis.com/css2?${fams}&display=swap&text=${encodeURIComponent(chars)}`);
}
function buildFontMenu(){
  const menu = $('#fontMenu');
  for (const f of FONTS) {
    const b = document.createElement('button');
    b.className = 'opt'; b.type = 'button'; b.setAttribute('role', 'menuitemradio'); b.dataset.face = f.id;
    const name = document.createElement('span'); name.textContent = f.name; name.style.fontFamily = f.stack || f.preview;
    const note = document.createElement('small'); note.textContent = f.note;
    b.append(name, note);
    b.addEventListener('click', () => { setFace(f.id); setMenu(false); $('#fontBtn').focus(); });
    menu.append(b);
  }
  syncFontMenu();
}
function syncFontMenu(){
  for (const b of $('#fontMenu').querySelectorAll('.opt')) b.setAttribute('aria-checked', String(b.dataset.face === fontFace));
  $('#fontBtn .aa').style.fontFamily = face().stack || face().preview;
  $('#fontBtn').title = `Reading font: ${face().name}`;
}
function setFace(id){
  fontFace = id;
  store.set('spine:face', id);
  syncFontMenu();
  restyleFrame();
}
function setMenu(open){
  if (open === menuOpen()) return;
  $('#fontMenu').hidden = !open;
  $('#fontBtn').setAttribute('aria-expanded', String(open));
  if (open) { loadPreviews(); ($('#fontMenu .opt[aria-checked="true"]') || $('#fontMenu .opt')).focus(); }
}
function menuKey(e){
  const opts = [...$('#fontMenu').querySelectorAll('.opt')];
  const i = opts.indexOf(document.activeElement);
  if (e.key === 'Escape') { e.preventDefault(); setMenu(false); $('#fontBtn').focus(); return true; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const n = e.key === 'ArrowDown' ? (i + 1) % opts.length : (i - 1 + opts.length) % opts.length;
    opts[n].focus(); return true;
  }
  if (e.key === 'Tab') { setMenu(false); return false; }
  return ['ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'f', 'F', 't', 'T', 'c', 'C', 'r', 'R', '[', ']', 'l', 'L'].includes(e.key);
}

/* ---------- Server voice ----------

   sentences ahead, and estimates the spoken word from playback position (neither engine reports
   word timings). */
const NEURAL = {
  kokoro: { name: 'Natural voice', st: k, ready: () => k.state === 'ready', load: () => kLoad(), size: () => FULL_PRECISION || k.gpu ? '~330 MB' : '~92 MB',
    agreed: () => !!store.get(`spine:agreed:kokoro:${FULL_PRECISION ? 'fp32' : 'q8'}`),
    generate: kGenerate, key: () => `kokoro|${FULL_PRECISION ? 'fp32' : 'q8'}|${k.voice}|${tts.rate}` },
  pocket: { name: 'Pocket TTS', st: pk, ready: pkReady, load: () => pkLoad(), size: () => `~${pocketMB()} MB`, playbackSpeed: true, stream: true,
    agreed: () => !!store.get(`spine:agreed:pocket:${pocketLang()}:${FULL_PRECISION ? 'fp32' : 'int8'}`),
    generate: pkGenerate, key: () => `pocket|${FULL_PRECISION ? 'fp32' : 'int8'}|${pk.lang}|${pkVoice()}` },
  server: { name: 'Server voice', st: sv, ready: () => sv.state === 'ready' && sv.voices.length > 0, load: () => svLoad(), auto: true, playbackSpeed: true, stream: true, agreed: () => true,

  const h = search.hits[search.cur];
  ttsUserNav();
  if (cur.i !== h.i) { await renderChapter(h.i); return; }   // searchAfterRender shows it
  searchHighlight(true);
}
function searchAfterRender(){ if (search.hits.length) searchHighlight(search.hits[search.cur]?.i === cur.i); }
// Highlight this chapter's matches; with show, bring the current one into view.
function searchHighlight(show = false){
  const win = frame.contentWindow, doc = frame.contentDocument;
  if (!win?.CSS?.highlights) return;
  win.CSS.highlights.delete('search-hit'); win.CSS.highlights.delete('search-current');
  const here = search.hits.filter(h => h.i === cur.i);
  if (!here.length) return;
  const blocks = textBlocks(doc, SEARCH_SKIP);
  const range = h => {
    const b = blocks[h.k]; if (!b || b.text !== h.text) return null;   // page differs from the index: skip
    const r = doc.createRange(), [n1, o1] = domPoint(b, h.a, false), [n2, o2] = domPoint(b, h.z, true);
    r.setStart(n1, o1); r.setEnd(n2, o2); return r;
  };
  const all = here.map(range).filter(Boolean);
  if (all.length) win.CSS.highlights.set('search-hit', new win.Highlight(...all));
  const h = search.hits[search.cur], r = h?.i === cur.i && range(h);
  if (!r) return;
  win.CSS.highlights.set('search-current', new win.Highlight(r));
  if (!show) return;
  if (scrolling()) { const se = scroller(), rect = r.getBoundingClientRect(); if (se) scrollTo(se.scrollTop + rect.top - frame.contentWindow.innerHeight * 0.3); }
  else showPage(pageOfRange(r));
}
$('#searchBox').addEventListener('input', e => { clearTimeout(search.timer); const q = e.target.value; search.timer = setTimeout(() => searchRun(q), 220); });
$('#searchBox').addEventListener('keydown', async e => {
  if (e.key === 'Escape') { e.preventDefault(); if (e.target.value) { e.target.value = ''; searchRun(''); } else e.target.blur(); return; }
  if (e.key !== 'Enter') return;
  e.preventDefault();
  if (e.target.value !== search.q) { clearTimeout(search.timer); await searchRun(e.target.value); searchGo(search.cur); return; }
  searchGo(search.cur + (e.shiftKey ? -1 : search.shown ? 1 : 0));   // the first Enter shows the nearest match
});
$('#searchPrev').addEventListener('click', () => searchGo(search.cur - 1));
$('#searchNext').addEventListener('click', () => searchGo(search.cur + 1));
$('#searchResults').addEventListener('click', e => {
  const btn = e.target.closest('button[data-n]'); if (!btn) return;
  searchGo(+btn.dataset.n);
  if (narrow.matches) setToc(false);
});

/* ---------- listening: media controls, sleep timer, time left ---------- */

/* Lock-screen, headphone and keyboard media keys while reading aloud (Media Session API). Browsers only
   route those keys to a page that is playing media, and device voices and streamed audio don't count, so a
   silent looping clip plays alongside whenever read-aloud is playing. */
const media = { keeper: null, active: false, meta: '' };
function mediaKeeper(){
  if (!media.keeper) {
    const n = 8000 * 10, buf = new ArrayBuffer(44 + n), v = new DataView(buf);   // 10 s of silence, 8 kHz, 8-bit
    const str = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
    str(0, 'RIFF'); v.setUint32(4, 36 + n, true); str(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
    v.setUint16(22, 1, true); v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
    str(36, 'data'); v.setUint32(40, n, true); new Uint8Array(buf, 44).fill(128);
    media.keeper = new Audio(URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })));
    media.keeper.loop = true;
  }
  return media.keeper;
}
function updateMedia(force = false){
  if (!('mediaSession' in navigator)) return;
  const ms = navigator.mediaSession;
  if (!tts.open || !book) {
    if (media.active) { ms.metadata = null; ms.playbackState = 'none'; media.keeper?.pause(); media.active = false; media.meta = ''; }
    return;
  }
  if (!media.active) {
    media.active = true;
    const on = (action, fn) => { try { ms.setActionHandler(action, fn); } catch {} };
    on('play', () => { if (!tts.playing) ttsTogglePlay(); });
    on('pause', () => { if (tts.playing) ttsTogglePlay(); });
    on('stop', () => { if (tts.playing) ttsTogglePlay(); });
    for (const a of ['nexttrack', 'seekforward']) on(a, () => $('#ttsNext').click());
    for (const a of ['previoustrack', 'seekbackward']) on(a, () => $('#ttsPrev').click());
  }
  const meta = [$('#chapLabel').textContent || book.title, book.authors.join(', '), book.title, book.artwork || ''];
  if (force || meta.join('|') !== media.meta) {
    media.meta = meta.join('|');
    try {
      ms.metadata = new MediaMetadata({ title: meta[0], artist: meta[1], album: meta[2],
        artwork: book.artwork ? [{ src: book.artwork, sizes: '256x256', type: 'image/png' }] : [] });
    } catch {}
  }
  ms.playbackState = tts.playing ? 'playing' : 'paused';
  const k = mediaKeeper();
  if (tts.playing && k.paused) k.play().catch(() => {});
  else if (!tts.playing && !k.paused) k.pause();
}

/* Sleep timer: counts down only while reading aloud is playing; when time is up, reading stops at the end of
   the sentence or passage being read (or straight away if that takes more than a minute). "Stop at chapter
   end" stops instead of going on to the next chapter. It runs on the clock (endAt), not by counting ticks:
   browsers slow timers down in background tabs, such as with the screen off. */
const sleep = { mode: 'off', left: 0, endAt: 0, due: 0 };
function setSleep(mode){
  sleep.mode = mode; sleep.due = 0; sleep.endAt = 0;
  sleep.left = /^\d+$/.test(mode) ? Number(mode) * 60 : 0;
  if (sleep.left && tts.playing) sleep.endAt = Date.now() + sleep.left * 1000;
  $('#ttsSleep').value = mode;
  sleepLabel();
}
function sleepLabel(){
  for (const o of $('#ttsSleep').options) {
    const minutes = /^\d+$/.test(o.value) ? o.value : null;
    o.textContent = minutes && o.value === sleep.mode
      ? (sleep.due ? 'Stopping after this passage' : `Stops in ${Math.floor(sleep.left / 60)}:${String(sleep.left % 60).padStart(2, '0')}`)
      : { off: 'No sleep timer', chapter: 'Stop at chapter end' }[o.value] || `Stop in ${o.value} min`;
  }
}
// Called where reading would go on to the next sentence by itself: true when the timer has run out.
function sleepDue(){
  if (!sleep.due) return false;
  tts.playing = false;
  setSleep('off');
  tts.note = 'Sleep timer: reading stopped';
  ttsUpdateBar();
  return true;
}
$('#ttsSleep').addEventListener('change', e => setSleep(e.target.value));

/* Time left in the chapter and the book, from how fast you read (page turns) or, while reading aloud, how
   fast the voice reads. Chapter lengths are counted in the background after a book opens. */
const pace = { read: Number(store.get('spine:readCpm')) || 1000, listen: 0, lastTurn: null, samples: [] };
async function chapterLengths(){
  const b = book;
  if (!b || b.comic) return null;
  b.lengths ??= (async () => {
    const out = [];
    for (let i = 0; i < b.spine.length; i++) {
      let n = 0;
      try { for (const blk of textBlocks(await chapterDoc(i), TTS_SKIP)) n += blk.text.replace(/\s+/g, ' ').trim().length; } catch {}
      out.push(n);
      if (i % 8 === 7) await new Promise(r => setTimeout(r));
    }
    return out;
  })();
  return b.lengths;
}
// How far reading aloud has got in this chapter, in characters (null when unknown).
function listenedChars(){
  if (tts.mo) return null;
  if (tts.doc !== frame.contentDocument || !tts.chunks?.length) return null;
  let n = 0;
  for (let i = 0; i < tts.ci && i < tts.chunks.length; i++) n += tts.chunks[i].e - tts.chunks[i].s;
  const c = tts.chunks[tts.ci];
  return c ? n + Math.max(0, tts.pos - c.s) : n;
}
function turnedPage(){   // learn the reading pace from forward page turns that took a believable time
  const now = performance.now(), at = { i: cur.i, f: fraction(), t: now };
  const last = pace.lastTurn; pace.lastTurn = at;
  if (!last || tts.playing || !book?.lengths || last.i !== at.i || at.f <= last.f) return;
  book.lengths.then(L => {
    const chars = (at.f - last.f) * (L?.[at.i] || 0), sec = (now - last.t) / 1000;
    if (chars < 200 || sec < 4 || sec > 600) return;
    pace.read = Math.round(Math.min(4000, Math.max(300, pace.read * 0.8 + (chars / sec * 60) * 0.2)));
    store.set('spine:readCpm', pace.read);
  });
}
function fmtLeft(sec){
  if (!(sec > 0)) return '';
  const m = Math.round(sec / 60);
  if (m < 1) return 'under a minute';
  if (m < 60) return `${m} min`;
  return `${Math.floor(m / 60)} h ${m % 60} min`;
}
async function updateTimeLeft(){
  const el = $('#timeLeft');
  const L = await chapterLengths();
  if (!L || !book || !L[cur.i]) { el.textContent = ''; return; }
  const listening = tts.open && !tts.mo && (tts.playing || n.paused);
  const done = listening ? listenedChars() : null;
  const inChapter = Math.max(0, done != null ? L[cur.i] - done : L[cur.i] * (1 - fraction()));
  const after = L.slice(cur.i + 1).reduce((a, b) => a + b, 0);
  const perSec = listening ? (pace.listen || 14 * tts.rate) : pace.read / 60;
  const ch = fmtLeft(inChapter / perSec), bk = fmtLeft((inChapter + after) / perSec);
  el.replaceChildren();
  if (!ch) return;
  const ctx = document.createElement('span'); ctx.className = 'ctx'; ctx.textContent = ' in chapter';
  el.append(` · ${ch} left`, ctx);
  if (after > 0) { const s = document.createElement('span'); s.className = 'book'; s.textContent = ` · ${bk} in book`; el.append(s); }
  el.title = listening ? 'At the read-aloud speed' : `At your reading speed (about ${Math.round(pace.read / 5)} words a minute)`;
}
// Once a second: the sleep timer, the read-aloud pace and (every few seconds) the time left.
let tick = 0;
setInterval(() => {
  tick++;
  if (sleep.left > 0 && !sleep.due) {
    if (tts.playing) {
      sleep.endAt ||= Date.now() + sleep.left * 1000;
      sleep.left = Math.max(0, Math.ceil((sleep.endAt - Date.now()) / 1000));
      if (sleep.left === 0) sleep.due = Date.now();
      sleepLabel();
    } else if (sleep.endAt) {   // paused: keep what's left
      sleep.left = Math.max(1, Math.ceil((sleep.endAt - Date.now()) / 1000)); sleep.endAt = 0;
    }
  }
  if (sleep.due && tts.playing && Date.now() - sleep.due > 60000) {   // a very long passage: stop now
    setSleep('off'); ttsTogglePlay(); tts.note = 'Sleep timer: reading stopped'; ttsUpdateBar();
  }
  const doneChars = tts.playing ? listenedChars() : null;
  if (doneChars != null) {
    const s = pace.samples; s.push([Date.now(), doneChars, cur.i]);
    while (s.length > 40) s.shift();
    const first = s.find(x => x[2] === cur.i);
    const span = (Date.now() - first[0]) / 1000, moved = doneChars - first[1];
    if (moved < 0 || moved > 3000) pace.samples = [[Date.now(), doneChars, cur.i]];   // a jump: start again
    else if (span >= 8 && moved > 0) pace.listen = moved / span;
  } else if (!tts.playing) pace.samples = [];
  if (tick % 5 === 0 && tts.open) updateTimeLeft();
}, 1000);

/* ---------- per-folder settings: reader-config.json ----------
   An optional JSON file next to the page overrides the settings constants for that folder (useful when
   index.html is linked into several folders), and can choose the defaults readers start with until they
   pick their own (theme, layout, text width, font, text size, line spacing, read-aloud engine). Unknown or
   invalid entries are ignored with a console warning; a missing file, or a "not found" page, is no config. */
const CONFIG_FILE = 'reader-config.json';
const CONFIG_SETTINGS = {   // name: [type, apply]
  DEFAULT_BOOK: ['string', v => { DEFAULT_BOOK = v; }],
  BOOKSHELF: ['string', v => { BOOKSHELF = v.endsWith('/') ? v : v + '/'; }],
  VOICE_FILES: ['string', v => { VOICE_FILES = v; }],
  LIB_FILES: ['string', v => { LIB_FILES = v; }],
  ALLOW_CDN: ['boolean', v => { ALLOW_CDN = v; }],
  TTS_SERVER: ['object', v => {
    if (typeof v.api !== 'string' || typeof v.voices !== 'string') throw new Error('needs "api" and "voices" paths');
    const dir = u => { const h = new URL(u, location.href).href; return h.endsWith('/') ? h : h + '/'; };
    TTS_SERVER = { api: dir(v.api), voices: dir(v.voices) };
  }],
  FULL_PRECISION: ['boolean', v => { FULL_PRECISION = v; }],
  ALLOW_REMOTE_CONTENT: ['boolean', v => { ALLOW_REMOTE_CONTENT = v; }],
  ALLOW_EXTERNAL_LINKS: ['boolean', v => { ALLOW_EXTERNAL_LINKS = v; }],
  LOOKAHEAD_SEC: ['number', v => { LOOKAHEAD_SEC = Math.max(0, v); }],
  SAVED_AUDIO_MB: ['number', v => { SAVED_AUDIO_MB = Math.max(0, v); }],
  NCACHE_SEC: ['number', v => { NCACHE_SEC = Math.max(30, v); }],
  SPAN_MAX: ['object', v => { SPAN_MAX = { ...SPAN_MAX, ...Object.fromEntries(Object.entries(v).filter(([k, n]) => k in SPAN_MAX && n > 20)) }; }],
  SEARCH_MAX: ['number', v => { SEARCH_MAX = Math.max(1, v); }],
  COMIC_PART: ['number', v => { COMIC_PART = Math.max(2, Math.round(v / 2) * 2); }],
};
const CONFIG_DEFAULTS = {   // name: [stored setting it defers to, check, apply]
  theme: ['spine:theme', v => v === 'light' || v === 'dark', v => document.documentElement.setAttribute('data-theme', v)],
  layout: ['spine:layout', v => v in LAYOUTS, v => { layout = v; }],
  width: ['spine:width', v => WIDTHS.some(w => w[0].toLowerCase() === String(v).toLowerCase()), v => { widthStep = WIDTHS.findIndex(w => w[0].toLowerCase() === v.toLowerCase()); }],
  font: ['spine:face', v => FONTS.some(f => f.id === v), v => { fontFace = v; }],
  fontSize: ['spine:font', v => typeof v === 'number' && v >= 60 && v <= 250, v => { fontPct = v; }],
  lineSpacing: ['spine:line', v => typeof v === 'number' && v >= 1 && v <= 3, v => { lineH = v; }],
  readAloud: ['spine:ttsEngine', v => ['device', 'kokoro', 'pocket', 'server'].includes(v), v => { tts.engine = v; }],
};
let readerConfig = null;   // the folder's config as loaded, for reference
async function loadConfig(){
  let cfg = null;
  try {
    const r = await fetch(new URL(CONFIG_FILE, location.href), { cache: 'no-cache' });
    if (r.ok && !looksHtml(r)) cfg = JSON.parse(await r.text());
  } catch (err) { if (!(err instanceof TypeError)) console.warn(`${CONFIG_FILE} isn't valid JSON, so it was ignored:`, err.message); }
  if (!cfg || typeof cfg !== 'object' || Array.isArray(cfg)) return;
  readerConfig = cfg;
  for (const [key, value] of Object.entries(cfg)) {
    try {
      if (CONFIG_SETTINGS[key]) {
        const [type, apply] = CONFIG_SETTINGS[key];
        if (typeof value !== type || value === null) throw new Error(`should be a ${type}`);
        apply(value);
      } else if (CONFIG_DEFAULTS[key]) {
        const [stored, ok, apply] = CONFIG_DEFAULTS[key];
        if (!ok(value)) throw new Error('not one of the allowed values');
        if (store.get(stored) == null) apply(value);   // the reader's own choice wins
      } else throw new Error('unknown setting');
    } catch (err) { console.warn(`${CONFIG_FILE}: ${key} ignored (${err.message})`); }
  }
  // Settings other values are worked out from.
  KOKORO.local = new URL('kokoro/', voiceFilesBase()).href;
  POCKET.local = new URL('pocket/', voiceFilesBase()).href;
}

/* ---------- start ---------- */
(async () => {
  await loadConfig();
  await Promise.all([setupFonts(), loadLib('jszip').catch(err => console.warn(err.message))]);
  $('#fontPct').textContent = fontPct + '%';
  setLine(lineH, false);   // applied, not saved: a reader's choice is saved when they make it
  setWidth(widthStep, false);
  setLayout(layout, false);
  syncFontMenu();
  { const t = store.get('spine:theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); }
  syncThemeBtn();
  setToc(!narrow.matches);
  if (!window.JSZip) {
    $('#bookTitle').textContent = 'Spine Reader';
    showNotice(ALLOW_CDN ? "The ZIP library didn't load, so EPUB files can't be opened. Check your connection and reload the page."
      : "The ZIP library isn't on this site (libs/jszip.min.js, from fetch-libs.sh), so EPUB files can't be opened.", 'error');
  } else {
    const ref = new URLSearchParams(location.search).get('book');
    await (ref ? openFromUrl(ref) : openDefault());
  }
})();
/* Without ?book=, a default.epub next to this page opens if there is one; otherwise the built-in sample.
   A missing file may still come back as 200 (a site's "not found" page), so the reply has to be a real
   EPUB: a ZIP with a META-INF/container.xml. Anything else falls back to the sample quietly. */
async function openDefault(){
  let zip = null;
  try {
    const found = await zipFromUrl(new URL(DEFAULT_BOOK, location.href), { cache: 'no-cache' });
    if (found.zip && getFile(found.zip, 'META-INF/container.xml')) zip = found.zip;
  } catch {}
  if (zip) {
    try { await openBook(zipSource(zip), { name: 'default' }); return; }
    catch (err) { console.warn(`${DEFAULT_BOOK} couldn't be opened:`, err); }
  }
  await openSample();
}
async function openSample(){
  try { await openBook(zipSource(await JSZip.loadAsync(await makeSample())), { sample: true }); }
  catch (err) { hideStatus(); showNotice("Couldn't build the sample book: " + err.message, 'error'); }
}
/* ?book=dir/ opens an extracted EPUB folder; ?book=dir/a.epub fetches and unzips the archive;
   ?book=dir/a.txt, .md or .html opens that document.
   A relative path is tried first relative to this page, then under BOOKSHELF at the site root
   (?book=books/x/ -> books/x/, then /bookshelf/books/x/). Only books on this same site are accepted. */
// A file name from an address, decoded; a stray "%" (not a valid escape) is kept as it is.
const safeDecode = t => { try { return decodeURIComponent(t); } catch { return t; } };
function bookCandidates(ref){
  const urls = [new URL(ref, location.href)];
  if (!ref.startsWith('/') && !isExternal(ref)) urls.push(new URL(BOOKSHELF + ref.replace(/^(\.\/)+/, ''), location.origin));
  for (const u of urls) { u.search = ''; u.hash = ''; }
  return urls.filter((u, i) => urls.findIndex(v => v.href === u.href) === i);
}
async function openFromUrl(ref){
  showStatus(`Loading ${ref}…`);
  // ref is already decoded (URLSearchParams did it): decoding again would turn "50%off" into an error.
  const name = (ref.replace(/\/+$/, '').split('/').pop() || ref).replace(/\.epub$/i, '');
  try {
    const candidates = bookCandidates(ref);
    if (candidates.some(u => u.origin !== location.origin)) throw new Error('Only books hosted on this same site can be opened from the address.');
    const misses = [];
    for (const u of candidates) {
      const kind = docKind(u.pathname);
      // Each candidate must really be the book: a "not found" page served with status 200 counts as a miss,
      // so the next location is tried.
      if (kind) {
        let r = null;
        try { r = await fetch(u.href); } catch {}
        if (!r?.ok) { misses.push(`${u.pathname} (${r ? r.status : 'network error'})`); continue; }
        if (kind !== 'html' && looksHtml(r)) { misses.push(`${u.pathname} (a web page came back instead)`); continue; }
        const buf = await r.arrayBuffer();
        if (kind === 'html' && await isSoftNotFound(u.href, new TextDecoder().decode(buf))) { misses.push(`${u.pathname} (the site's "not found" page)`); continue; }
        // Images, stylesheets and links in the document resolve against its folder on the server.
        await openDocument(buf, safeDecode(u.pathname.split('/').pop()), kind,
          { base: new URL('.', u.href).href, key: `spine:pos:url:${u.pathname}` });
        return;
      }
      if (/\.(epub|cbz)$/i.test(u.pathname)) {
        const found = await zipFromUrl(u.href);
        if (found.miss) { misses.push(`${u.pathname} (${found.miss})`); continue; }
        const zip = found.zip;
        if (/\.epub$/i.test(u.pathname) && !getFile(zip, 'META-INF/container.xml')) { misses.push(`${u.pathname} (no META-INF/container.xml)`); continue; }
        await openZip(zip, safeDecode(u.pathname.split('/').pop()), { key: `spine:pos:url:${u.pathname}` });
        return;
      }
      if (!u.pathname.endsWith('/')) u.pathname += '/';
      const src = dirSource(u.href);
      const container = await src.text('META-INF/container.xml');
      if (!container || !parseDoc(container, 'application/xml')?.getElementsByTagNameNS('*', 'rootfile')[0]) {
        misses.push(`${u.pathname} (no META-INF/container.xml)`); continue;
      }
      await openBook(src, { name });
      return;
    }
    throw new Error(`Nothing was found at ${misses.join(' or ')}.`);
  } catch (err) {
    await openDefault();   // the folder's default book (or the sample), with a note about the link
    showNotice(friendly(err, ref), 'error');
  }
}
})();
</script>
